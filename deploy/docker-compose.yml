# ============================================================
# FAQ 智能问答机器人 - Docker Compose 编排
#
# 使用方法:
#   docker-compose up -d
#
# 说明:
#   - 仅部署 FAQ 机器人服务（数据库需提前准备好）
#   - .env 文件需从 .env.example 复制并修改
#   - uploads 目录持久化存储用户上传的文件
# ============================================================

version: '3.8'

services:
  faq-bot:
    image: faq-bot:v5.0
    container_name: faq-bot
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      # 上传文件持久化
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
