<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能客服</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f5f7fa; height: 100vh; display: flex; flex-direction: column; }
    .header { background: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eee; }
    .header .logo { width: 40px; height: 40px; background: linear-gradient(135deg, #4361ee, #3a56d4); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
    .header .info h1 { font-size: 16px; color: #333; }
    .header .info p { font-size: 12px; color: #999; }
    .chat-area { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { display: flex; gap: 10px; margin-bottom: 16px; max-width: 75%; animation: fadeUp .3s ease; }
    .msg.user { margin-left: auto; flex-direction: row-reverse; }
    .msg .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .msg.bot .avatar { background: #e8ecf1; }
    .msg.user .avatar { background: #4361ee; color: #fff; }
    .msg .content { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .msg.bot .content { background: #fff; color: #333; border-top-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .msg.user .content { background: #4361ee; color: #fff; border-top-right-radius: 2px; }
    .msg .content table { margin: 8px 0; border-collapse: collapse; width: 100%; font-size: 13px; }
    .msg .content th, .msg .content td { padding: 6px 10px; border: 1px solid #e8e8e8; text-align: left; }
    .msg .content th { background: #f8f9fa; font-weight: 600; }
    .msg .card { background: #f8f9fa; border-radius: 8px; padding: 12px; margin: 8px 0; border: 1px solid #eee; }
    .msg .card-title { font-weight: 600; font-size: 13px; margin-bottom: 8px; }
    .msg .card-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; border-bottom: 1px solid #eee; }
    .msg .card-row:last-child { border: none; }
    .msg .card-row .lbl { color: #888; }
    .msg .links { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .msg .links a { padding: 4px 10px; background: #eef2ff; color: #4361ee; border-radius: 12px; font-size: 12px; text-decoration: none; }
    .msg .related { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
    .msg .related span { padding: 4px 12px; background: #f0f2f5; border: 1px solid #e0e0e0; border-radius: 14px; font-size: 12px; color: #555; cursor: pointer; }
    .msg .related span:hover { background: #4361ee; color: #fff; border-color: #4361ee; }
    .msg .src { margin-top: 6px; font-size: 11px; color: #bbb; }
    .msg .dbg { margin-top: 6px; font-size: 11px; color: #999; background: #fafafa; border: 1px dashed #ddd; border-radius: 6px; padding: 6px 8px; line-height: 1.6; word-break: break-all; }
    .debug-badge { font-size: 10px; color: #e8590c; background: #fff4e6; border: 1px solid #ffd8a8; border-radius: 10px; padding: 1px 8px; margin-left: 8px; }
    .quick-bar { padding: 8px 20px; display: flex; gap: 8px; flex-wrap: wrap; background: #fff; border-top: 1px solid #eee; }
    .quick-bar span { padding: 6px 14px; background: #f5f7fa; border: 1px solid #e0e0e0; border-radius: 16px; font-size: 13px; color: #555; cursor: pointer; transition: .2s; }
    .quick-bar span:hover { background: #4361ee; color: #fff; border-color: #4361ee; }
    .input-bar { padding: 12px 20px; background: #fff; border-top: 1px solid #eee; display: flex; gap: 10px; }
    .input-bar input { flex: 1; padding: 10px 16px; border: 1.5px solid #ddd; border-radius: 20px; font-size: 15px; outline: none; }
    .input-bar input:focus { border-color: #4361ee; }
    .input-bar button { padding: 10px 20px; background: #4361ee; color: #fff; border: none; border-radius: 20px; font-size: 15px; cursor: pointer; }
    .input-bar button:disabled { background: #b0b8c8; }
    .typing { display: flex; gap: 4px; padding: 4px 0; }
    .typing i { width: 6px; height: 6px; background: #ccc; border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; display: block; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .welcome { text-align: center; padding: 60px 20px; color: #aaa; }
    .welcome .ico { font-size: 40px; margin-bottom: 12px; }
    .welcome h2 { font-size: 17px; color: #555; margin-bottom: 6px; font-weight: 500; }
    .welcome p { font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">💬</div>
    <div class="info"><h1>智能客服</h1><p>在线</p></div>
  </div>
  <div class="chat-area" id="chat"></div>
  <div class="quick-bar" id="quickBar">
    <span onclick="ask('怎么交燃气费')">怎么交燃气费</span>
    <span onclick="ask('天然气多少钱')">天然气多少钱</span>
    <span onclick="ask('营业厅在哪里')">营业厅在哪</span>
    <span onclick="ask('燃气表坏了')">燃气表故障</span>
    <span onclick="ask('打不着火')">打不着火</span>
  </div>
  <div class="input-bar">
    <input id="inp" placeholder="请输入您的问题..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()" id="btn">发送</button>
  </div>

<script>
const chat = document.getElementById('chat')
let sid = 's' + Date.now()
const uid = new URLSearchParams(window.location.search).get('userId') || null
const isDebug = new URLSearchParams(window.location.search).get('debug') === '1'
let firstMsg = true

if (isDebug) {
  document.querySelector('.header .info p').innerHTML = '在线 <span class="debug-badge">调试模式</span>'
}

function ask(t) { document.getElementById('inp').value = t; send() }

async function send() {
  const inp = document.getElementById('inp')
  const text = inp.value.trim()
  if (!text) return
  if (firstMsg) { chat.innerHTML = ''; firstMsg = false }
  addMsg('user', text)
  inp.value = ''
  document.getElementById('btn').disabled = true
  const typing = addTyping()
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text, sessionId: sid, userId: uid, debug: isDebug}) })
    const d = await r.json()
    typing.remove()
    addBotMsg(d)
  } catch(e) {
    typing.remove()
    addMsg('bot', '网络异常，请稍后重试')
  }
  document.getElementById('btn').disabled = false
  inp.focus()
}

function addMsg(role, text) {
  const d = document.createElement('div')
  d.className = 'msg ' + role
  d.innerHTML = `<div class="avatar">${role==='user'?'👤':'🤖'}</div><div class="content">${esc(text)}</div>`
  chat.appendChild(d)
  chat.scrollTop = chat.scrollHeight
}

function addBotMsg(d) {
  const el = document.createElement('div')
  el.className = 'msg bot'
  let h = `<div class="avatar">🤖</div><div class="content">${esc(d.answer)}`
  if (d.richContent) h += renderRich(d.richContent)
  if (d.links?.length) h += `<div class="links">${d.links.map(l=>`<a href="${l.url}" target="_blank">🔗 ${l.text}</a>`).join('')}</div>`
  if (d.related?.length) h += `<div class="related">${d.related.map(q=>`<span onclick="ask('${q}')">${q}</span>`).join('')}</div>`
  if (d.source) { const m={direct:'FAQ',confirmed:'FAQ',clarify:'追问',llm:'AI',fallback:'兜底',meaningless:'无意义',task_started:'任务开始',task_progress:'任务进行',task_complete:'任务完成',task_cancelled:'任务取消',task_faq:'任务+FAQ'}; h += `<div class="src">${m[d.source]||d.source}${d.confidence?' · '+Math.round(d.confidence*100)+'%':''}</div>` }
  // 调试信息（?debug=1 时显示）
  if (isDebug) {
    let dbg = `source=${d.source} | intent=${d.intent_code||'-'} | conf=${d.confidence?Math.round(d.confidence*100)+'%':'-'}`
    const t = d._debug && d._debug.task
    if (t) {
      if (t.active) {
        dbg += `<br>task=${t.taskCode} [${t.status}] step=${t.currentStep}${t.pendingModify?(' | 修改中→'+t.pendingModify):''}`
        if (t.slots && t.slots.length) {
          dbg += `<br>slots: ` + t.slots.map(s=>`${s.key}${s.filled?'=「'+(s.value||'')+'」':'=待填'}`).join(' | ')
        }
      } else {
        dbg += `<br>task=无`
      }
    }
    h += `<div class="dbg">${dbg}</div>`
  }
  h += '</div>'
  el.innerHTML = h
  chat.appendChild(el)
  chat.scrollTop = chat.scrollHeight
}

function renderRich(rc) {
  // 新格式：富媒体列表
  if (rc.items && Array.isArray(rc.items)) {
    let h = ''
    for (const item of rc.items) {
      if (item.type === 'image') {
        h += `<div style="margin:8px 0"><img src="${item.url}" style="max-width:100%;border-radius:8px;cursor:pointer" onclick="window.open('${item.url}')" alt="${item.name||''}"></div>`
      } else if (item.type === 'video') {
        h += `<div style="margin:8px 0"><video src="${item.url}" controls style="max-width:100%;border-radius:8px" preload="metadata"></video></div>`
      } else if (item.type === 'audio') {
        h += `<div style="margin:8px 0"><audio src="${item.url}" controls style="width:100%" preload="metadata"></audio></div>`
      } else if (item.type === 'pdf') {
        h += `<div style="margin:8px 0"><a href="${item.url}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#f8f9fa;border:1px solid #ddd;border-radius:8px;text-decoration:none;color:#333;font-size:13px">📄 ${item.name||'PDF文档'}</a></div>`
      }
    }
    return h
  }
  // 旧格式兼容
  if (rc.type==='table') {
    let h='<table>'; if(rc.headers) h+=`<tr>${rc.headers.map(h=>`<th>${h}</th>`).join('')}</tr>`
    if(rc.rows) rc.rows.forEach(r=>{h+=`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`})
    return h+'</table>'
  }
  if (rc.type==='card') {
    let h=`<div class="card">${rc.title?`<div class="card-title">${rc.title}</div>`:''}`
    if(rc.fields) rc.fields.forEach(f=>{h+=`<div class="card-row"><span class="lbl">${f.label}</span><span>${f.value}</span></div>`})
    return h+'</div>'
  }
  return ''
}

function addTyping() {
  const d = document.createElement('div'); d.className='msg bot'; d.id='tp'
  d.innerHTML=`<div class="avatar">🤖</div><div class="content"><div class="typing"><i></i><i></i><i></i></div></div>`
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') }

// 初始欢迎
chat.innerHTML = `<div class="welcome"><div class="ico">💬</div><h2>您好，请问有什么可以帮您？</h2><p>请直接输入问题，我会为您提供解答</p></div>`
</script>
</body>
</html>
