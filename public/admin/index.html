<body>
  <!-- 聊天预览右侧面板 -->
  <div id="chat-preview-panel">
    <div id="chat-preview-resize"></div>
    <div id="chat-preview-header">
      <h3>💬 聊天预览</h3>

  <div id="app"></div>

  <!-- 认证层：登录 + XHR 拦截 -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="logo">🤖</div>
      <h2>FAQ 管理后台</h2>
      <p class="subtitle">请登录以继续</p>
      <form id="auth-form">
        <div class="field">
          <label for="auth-username">用户名</label>
          <input type="text" id="auth-username" placeholder="请输入用户名" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="auth-password">密码</label>
          <input type="password" id="auth-password" placeholder="请输入密码" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn" id="auth-submit">登 录</button>
        <div class="error-msg" id="auth-error"></div>
      </form>
    </div>
  </div>

  <script>
  (function() {
    'use strict';
    var TOKEN_KEY = 'faq_admin_token';
    var overlay = document.getElementById('auth-overlay');
    var form = document.getElementById('auth-form');
    var errEl = document.getElementById('auth-error');
    var submitBtn = document.getElementById('auth-submit');

    // ===== Token 管理 =====
    function getToken() {
      try { return localStorage.getItem(TOKEN_KEY); } catch(e) { return null; }
    }
    function setToken(t) {
      try { localStorage.setItem(TOKEN_KEY, t); } catch(e) {}
    }
    function clearToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch(e) {}
    }

    // ===== 显示/隐藏登录 =====
    function showLogin() {
      overlay.classList.remove('hidden');
    }
    function hideLogin() {
      overlay.classList.add('hidden');
    }

    // ===== 登录请求 =====
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var username = document.getElementById('auth-username').value.trim();
      var password = document.getElementById('auth-password').value;
      if (!username || !password) {
        errEl.textContent = '请输入用户名和密码';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '登录中...';
      errEl.textContent = '';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/auth/login', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      // 标记这是登录请求，避免被拦截器循环调用
      xhr._isLoginReq = true;
      xhr.onload = function() {
        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
        if (xhr.status === 200) {
          try {
            var res = JSON.parse(xhr.responseText);
            if (res.success && res.token) {
              setToken(res.token);
              hideLogin();
              // 触发页面刷新让 Vue 重新加载
              window.location.reload();
              return;
            }
          } catch(ex) {}
          errEl.textContent = '登录响应异常';
        } else if (xhr.status === 401) {
          errEl.textContent = '用户名或密码错误';
        } else {
          errEl.textContent = '登录失败，请重试';
        }
        document.getElementById('auth-password').value = '';
        document.getElementById('auth-password').focus();
      };
      xhr.onerror = function() {
        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
        errEl.textContent = '网络错误，请检查服务是否运行';
      };
      xhr.send(JSON.stringify({ username: username, password: password }));
    });

    // ===== Monkey-patch XMLHttpRequest 注入 Authorization =====
    var OrigXHR = XMLHttpRequest;
    var origOpen = OrigXHR.prototype.open;
    var origSend = OrigXHR.prototype.send;
    var origSetRequestHeader = OrigXHR.prototype.setRequestHeader;

    OrigXHR.prototype.open = function(method, url) {
      this._authUrl = url;
      return origOpen.apply(this, arguments);
    };

    OrigXHR.prototype.send = function() {
      var token = getToken();
      var self = this;

      // 如果是登录请求，不注入 token
      if (this._isLoginReq) {
        return origSend.apply(this, arguments);
      }

      // 如果有 token 且是 API 请求，注入 Authorization
      if (token && this._authUrl && this._authUrl.indexOf('/api/') === 0) {
        try { origSetRequestHeader.call(this, 'Authorization', 'Bearer ' + token); } catch(e) {}
      }

      // 监听 401 响应
      var origOnload = this.onload;
      var origOnreadystatechange = this.onreadystatechange;

      function check401() {
        if (self.status === 401 && self._authUrl && self._authUrl.indexOf('/api/') === 0) {
          clearToken();
          showLogin();
        }
      }

      if (origOnload) {
        this.onload = function() {
          check401();
          return origOnload.apply(this, arguments);
        };
      }
      if (origOnreadystatechange) {
        this.onreadystatechange = function() {
          if (self.readyState === 4) check401();
          return origOnreadystatechange.apply(this, arguments);
        };
      }
      if (!origOnload && !origOnreadystatechange) {
        this.addEventListener('load', check401);
      }

      return origSend.apply(this, arguments);
    };

    // ===== 同时拦截 fetch（以防部分代码使用 fetch）=====
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function(input, init) {
        var token = getToken();
        var url = typeof input === 'string' ? input : (input && input.url) || '';

        if (token && url.indexOf('/api/') === 0) {
          init = init || {};
          init.headers = init.headers || {};
          if (init.headers instanceof Headers) {
            if (!init.headers.has('Authorization')) {
              init.headers.set('Authorization', 'Bearer ' + token);
            }
          } else if (typeof init.headers === 'object') {
            if (!init.headers['Authorization']) {
              init.headers['Authorization'] = 'Bearer ' + token;
            }
          }
        }

        return origFetch.call(this, input, init).then(function(resp) {
          if (resp.status === 401 && url.indexOf('/api/') === 0) {
            clearToken();
            showLogin();
          }
          return resp;
        });
      };
    }

    // ===== 启动检查 =====
    if (getToken()) {
      // 验证 token 是否仍然有效
      var verifyXhr = new OrigXHR();
      verifyXhr._isLoginReq = true;
      verifyXhr.open('GET', '/api/auth/verify', true);
      verifyXhr.setRequestHeader('Authorization', 'Bearer ' + getToken());
      verifyXhr.onload = function() {
        if (verifyXhr.status === 200) {
          try {
            var res = JSON.parse(verifyXhr.responseText);
            if (res.valid) { hideLogin(); return; }
          } catch(e) {}
        }
        clearToken();
        showLogin();
      };
      verifyXhr.onerror = function() {
        // 网络错误时也显示登录
        showLogin();
      };
      verifyXhr.send();
    } else {
      showLogin();
    }

    // ===== 表格列宽修正 =====
    // Element Plus el-table-column 的 width 百分比值会被当作像素写入 colgroup
    // 此函数读取 col 的像素值作为比例，按容器实际宽度重新分配
    function setTableColumnWidths() {
      var tables = document.querySelectorAll('.el-table');
      tables.forEach(function(table) {
        var headerTable = table.querySelector('.el-table__header-wrapper table');
        if (!headerTable) return;
        var cols = headerTable.querySelectorAll('col');
        if (!cols.length) return;
        var containerWidth = table.clientWidth;
        if (containerWidth <= 0) return;
        // 收集每列的原始值（Element Plus 把百分比当像素写入 col width）
        var ratios = [];
        var totalRatio = 0;
        for (var i = 0; i < cols.length; i++) {
          var w = parseFloat(cols[i].getAttribute('width') || '0');
          ratios.push(w);
          totalRatio += w;
        }
        if (totalRatio <= 0) return;
        // 检查是否已经正确设置（避免重复计算）
        var firstColWidth = parseFloat(cols[0].getAttribute('width') || '0');
        var expectedFirst = Math.round((ratios[0] / totalRatio) * containerWidth);
        if (expectedFirst < 40) expectedFirst = 40;
        if (Math.abs(firstColWidth - expectedFirst) < 2) return; // 已正确，跳过
        // 按比例重新分配实际像素宽度
        var bodyTable = table.querySelector('.el-table__body-wrapper table');
        var bodyCols = bodyTable ? bodyTable.querySelectorAll('col') : [];
        var headerCells = headerTable.querySelectorAll('th');
        // 修正 body table 的内联宽度（Element Plus 设为错误的像素值）
        if (bodyTable) bodyTable.style.width = containerWidth + 'px';
        for (var i = 0; i < cols.length; i++) {
          var px = Math.round((ratios[i] / totalRatio) * containerWidth);
          if (px < 40) px = 40;
          cols[i].setAttribute('width', px);
          if (bodyCols[i]) bodyCols[i].setAttribute('width', px);
          if (headerCells[i]) headerCells[i].style.width = px + 'px';
        }
      });
    }
    // 持续轮询修正表格列宽（Element Plus 虚拟 DOM 会覆盖直接修改）
    setInterval(setTableColumnWidths, 500);
    setTimeout(setTableColumnWidths, 200);

    // ===== 修复分类树重复 header =====
    function fixDuplicateHeader() {
      var panels = document.querySelectorAll('.category-tree');
      panels.forEach(function(panel) {
        var inner = panel.querySelector('.category-tree');
        if (inner) {
          var header = inner.querySelector('.tree-header');
          if (header) header.style.display = 'none';
        }
      });
    }
    var observer = new MutationObserver(fixDuplicateHeader);
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });
    setTimeout(fixDuplicateHeader, 500);
    setTimeout(fixDuplicateHeader, 1500);
  })();
  </script>
<script>
(function(){
  var reqVisible=true, rateVisible=true;
  function updateLegend(){
    var reqEl=document.querySelector('.legend-req');
    var rateEl=document.querySelector('.legend-rate');
    if(reqEl) reqEl.classList.toggle('disabled',!reqVisible);
    if(rateEl) rateEl.classList.toggle('disabled',!rateVisible);
  }
  function updateBars(){
    document.querySelectorAll('.trend-bar:not(.trend-bar-rate)').forEach(function(b){
      b.classList.toggle('hidden',!reqVisible);
    });
    document.querySelectorAll('.trend-bar-rate').forEach(function(b){
      b.classList.toggle('hidden',!rateVisible);
    });
  }
  document.addEventListener('click',function(e){
    var target=e.target.closest('.legend-item');
    if(!target) return;
    if(target.classList.contains('legend-req')){
      reqVisible=!reqVisible;
      updateLegend();
      updateBars();
    } else if(target.classList.contains('legend-rate')){
      rateVisible=!rateVisible;
      updateLegend();
      updateBars();
    }
  });
})();
</script>
<script>
// ===== 聊天预览右侧面板 =====
(function(){
  var panel = document.getElementById('chat-preview-panel');
  var iframe = document.getElementById('chat-preview-iframe');
  var closeBtn = document.getElementById('chat-preview-close');
  var resizeHandle = document.getElementById('chat-preview-resize');
  var isOpen = false;

  function openPreview() {
    if (!isOpen) {
      iframe.src = '/';
      panel.classList.add('show');
      isOpen = true;
    }
  }
  function closePreview() {
    panel.classList.remove('show');
    iframe.src = 'about:blank';
    isOpen = false;
  }

  closeBtn.addEventListener('click', closePreview);

  // 拖拽调整宽度
  var resizing = false, startX = 0, startW = 0;
  resizeHandle.addEventListener('mousedown', function(e) {
    resizing = true;
    startX = e.clientX;
    startW = panel.offsetWidth;
    resizeHandle.classList.add('active');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!resizing) return;
    var newW = startW + (startX - e.clientX);
    if (newW >= 300 && newW <= window.innerWidth * 0.7) {
      panel.style.width = newW + 'px';
    }
  });
  document.addEventListener('mouseup', function() {
    if (resizing) { resizing = false; resizeHandle.classList.remove('active'); }
  });

  // 拦截"聊天预览"菜单项的点击
  document.addEventListener('click', function(e) {
    var menuItem = e.target.closest('.el-menu-item');
    if (menuItem && menuItem.textContent.trim() === '聊天预览') {
      e.preventDefault();
      e.stopPropagation();
      openPreview();
    }
  }, true);
})();
// ===== 规则引擎页面 - 任务管理标签页 =====
(function(){
  var injected = false;
  var observer = new MutationObserver(function(){
    if (injected) return;
    var panel = document.querySelector('.config-panel');
    if (!panel) return;
    // 检查是否已在规则引擎页面（通过内容判断）
    var h3 = panel.querySelector('h3');
    if (!h3 || h3.textContent.indexOf('对话规则') === -1) return;
    injected = true;
    injectTaskTabs(panel);
  });
  observer.observe(document.getElementById('app'), { childList: true, subtree: true });

  // 监听路由变化，重置注入标记
  var lastHref = location.href;
  setInterval(function(){
    if (location.href !== lastHref) {
      lastHref = location.href;
      injected = false;
    }
  }, 300);

  function injectTaskTabs(panel) {
    // 创建标签导航
    var tabs = document.createElement('div');
    tabs.id = 'rules-tabs';
    tabs.innerHTML = '<button class="tab-btn active" data-tab="rules">对话规则</button><button class="tab-btn" data-tab="tasks">任务流程</button>';
    // 把原有内容包进 tab panel
    var rulesPanel = document.createElement('div');
    rulesPanel.className = 'tab-panel active';
    rulesPanel.id = 'tab-rules';
    while (panel.firstChild) rulesPanel.appendChild(panel.firstChild);
    // 创建任务面板
    var tasksPanel = document.createElement('div');
    tasksPanel.className = 'tab-panel';
    tasksPanel.id = 'tab-tasks';
    tasksPanel.innerHTML = buildTaskPanelHTML();
    // 组装
    panel.appendChild(tabs);
    panel.appendChild(rulesPanel);
    panel.appendChild(tasksPanel);
    // 标签切换
    tabs.addEventListener('click', function(e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;
      tabs.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active') });
      btn.classList.add('active');
      var tab = btn.getAttribute('data-tab');
      rulesPanel.classList.toggle('active', tab === 'rules');
      tasksPanel.classList.toggle('active', tab === 'tasks');
      if (tab === 'tasks') loadTasks();
    });
  }

  // ===== 任务面板 HTML =====
  function buildTaskPanelHTML() {
    return '<div class="task-panel">' +
      '<div class="task-header">' +
        '<h4>任务流程管理</h4>' +
        '<button class="btn-sm btn-primary" id="task-add-btn">+ 新建任务</button>' +
      '</div>' +
      '<div id="task-list-area"><div class="task-empty"><div class="icon">📋</div><div>加载中...</div></div></div>' +
    '</div>';
  }

  // ===== 加载任务列表 =====
  function loadTasks() {
    var area = document.getElementById('task-list-area');
    if (!area) return;
    api('GET', '/api/tasks', null, function(res) {
      if (!res.success || !res.data || !res.data.length) {
        area.innerHTML = '<div class="task-empty"><div class="icon">📋</div><div>暂无任务流程</div><div style="margin-top:8px;font-size:12px">点击"新建任务"创建多轮对话任务</div></div>';
        return;
      }
      var html = '<div class="task-table-wrap"><table class="el-table" style="width:100%">';
      html += '<thead><tr><th style="width:50px">#</th><th>编码</th><th>名称</th><th>触发词</th><th>步骤数</th><th>状态</th><th style="width:180px">操作</th></tr></thead><tbody>';
      res.data.forEach(function(t, i) {
        var kws = (t.trigger_keywords || []).map(function(k){ return typeof k === 'string' ? k : k.regex || ''; }).join(', ');
        var slots = t.slots || [];
        var stepCount = (t.steps && t.steps.length) ? t.steps.length : (slots.length ? '自动' : '0');
        var statusCls = t.status === 1 ? 'on' : 'off';
        var statusText = t.status === 1 ? '启用' : '禁用';
        html += '<tr>';
        html += '<td>' + (i+1) + '</td>';
        html += '<td><code>' + esc(t.code) + '</code></td>';
        html += '<td>' + esc(t.name) + '</td>';
        html += '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(kws) + '">' + esc(kws || '-') + '</td>';
        html += '<td>' + stepCount + '</td>';
        html += '<td><span class="status-tag ' + statusCls + '">' + statusText + '</span></td>';
        html += '<td>';
        html += '<button class="btn-sm" onclick="editTask(\'' + esc(t.code) + '\')">编辑</button> ';
        html += '<button class="btn-sm" onclick="toggleTask(\'' + esc(t.code) + '\',' + (t.status === 1 ? 0 : 1) + ')">' + (t.status === 1 ? '禁用' : '启用') + '</button> ';
        html += '<button class="btn-sm btn-danger" onclick="deleteTask(\'' + esc(t.code) + '\')">删除</button>';
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      area.innerHTML = html;
    });
  }

  // ===== 编辑/新建任务弹窗 =====
  window.editTask = function(code) {
    api('GET', '/api/tasks/' + code, null, function(res) {
      if (res.success && res.data) showTaskModal(res.data);
    });
  };
  window.addTask = function() { showTaskModal(null); };

  // 绑定新建按钮
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'task-add-btn') { window.addTask(); }
  });

  function showTaskModal(task) {
    var isEdit = !!task;
    var overlay = document.createElement('div');
    overlay.className = 'task-modal-overlay';
    overlay.innerHTML = '<div class="task-modal">' +
      '<div class="task-modal-header"><h3>' + (isEdit ? '编辑任务' : '新建任务') + '</h3><button class="close-btn" id="task-modal-close">&times;</button></div>' +
      '<div class="task-modal-body">' +
        '<div class="form-group"><label>任务编码（唯一标识，英文）</label><input id="tf-code" value="' + esc(isEdit ? task.code : '') + '" ' + (isEdit ? 'readonly style="background:#f5f5f5"' : '') + ' placeholder="如：repair_order"></div>' +
        '<div class="form-group"><label>任务名称</label><input id="tf-name" value="' + esc(isEdit ? task.name : '') + '" placeholder="如：报修工单"></div>' +
        '<div class="form-group"><label>描述</label><textarea id="tf-desc" placeholder="任务描述（可选）">' + esc(isEdit ? (task.description || '') : '') + '</textarea></div>' +
        '<div class="form-group"><label>触发关键词（回车添加）</label>' +
          '<div id="tf-keywords">' + buildKeywordTags(isEdit ? task.trigger_keywords : []) + '</div>' +
          '<input id="tf-kw-input" placeholder="输入关键词后回车" style="margin-top:6px">' +
        '</div>' +
        '<div class="form-group"><label>意图例句（NLU 理解用，回车添加）</label>' +
          '<div id="tf-examples">' + buildExampleTags(isEdit ? (task.intent_examples || []) : []) + '</div>' +
          '<input id="tf-example-input" placeholder="用户可能怎么说，如：燃气表坏了需要维修" style="margin-top:6px">' +
          '<div style="color:#999;font-size:12px;margin-top:4px">例句帮助 AI 理解该任务的业务场景，新增业务只需写好例句</div>' +
        '</div>' +
        '<div class="form-group"><label>槽位定义（需要收集的信息）</label>' +
          '<div id="tf-slots">' + buildSlotRows(isEdit ? task.slots : []) + '</div>' +
          '<button class="btn-sm" id="tf-add-slot" style="margin-top:6px">+ 添加槽位</button>' +
        '</div>' +
        '<div class="form-group"><label>完成动作（可选）</label>' +
          '<select id="tf-action"><option value="complete_message">仅回复完成话术</option></select>' +
          '<input id="tf-action-msg" placeholder="动作成功后回复（完成话术）" value="' + esc(isEdit ? (task.completion_message || '') : '') + '" style="margin-top:6px">' +
        '</div>' +
        '<div class="form-group"><label>流程步骤（v2 步骤 DSL）</label>' +
          '<div id="tf-steps">' + buildStepRows(isEdit ? (task.steps || []) : []) + '</div>' +
          '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">' +
            '<button class="btn-sm" id="tf-auto-steps">⚡ 从槽位自动生成</button>' +
            '<button class="btn-sm" id="tf-add-step">+ 添加步骤</button>' +
          '</div>' +
          '<div style="color:#999;font-size:12px;margin-top:4px">提示：点"从槽位自动生成"可一键生成「收集 → 确认 → 动作」流程，再按需增删调整；分支步骤在 JSON 里配置 cases</div>' +
        '</div>' +
        '<div class="form-group"><label>完成提示语</label><textarea id="tf-complete" placeholder="所有信息收集完毕后的回复">' + esc(isEdit ? (task.completion_message || '') : '') + '</textarea></div>' +
      '</div>' +
      '<div class="task-modal-footer">' +
        '<button class="btn-sm" id="tf-cancel">取消</button>' +
        '<button class="btn-sm btn-primary" id="tf-save">保存</button>' +
      '</div>' +
    '</div>';
    document.body.appendChild(overlay);

    // 事件绑定
    overlay.querySelector('#task-modal-close').onclick = function(){ overlay.remove(); };
    overlay.querySelector('#tf-cancel').onclick = function(){ overlay.remove(); };
    overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.remove(); });

    // 关键词输入
    var kwInput = overlay.querySelector('#tf-kw-input');
    kwInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && kwInput.value.trim()) {
        e.preventDefault();
        var kw = kwInput.value.trim();
        var container = overlay.querySelector('#tf-keywords');
        var tag = document.createElement('span');
        tag.className = 'keyword-tag';
        tag.innerHTML = esc(kw) + '<span class="remove">&times;</span>';
        tag.setAttribute('data-value', kw);
        tag.querySelector('.remove').onclick = function(){ tag.remove(); };
        container.appendChild(tag);
        kwInput.value = '';
      }
    });

    // 意图例句输入
    var exInput = overlay.querySelector('#tf-example-input');
    if (exInput) exInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && exInput.value.trim()) {
        e.preventDefault();
        var ex = exInput.value.trim();
        var container = overlay.querySelector('#tf-examples');
        var tag = document.createElement('span');
        tag.className = 'keyword-tag';
        tag.innerHTML = esc(ex) + '<span class="remove">&times;</span>';
        tag.setAttribute('data-value', ex);
        tag.querySelector('.remove').onclick = function(){ tag.remove(); };
        container.appendChild(tag);
        exInput.value = '';
      }
    });

    // 添加槽位
    overlay.querySelector('#tf-add-slot').onclick = function() {
      var container = overlay.querySelector('#tf-slots');
      container.insertAdjacentHTML('beforeend', buildOneSlotRow({key:'',label:'',prompt:'',extract_type:'text',extract_rule:'',required:true}));
      bindSlotDel(container.lastElementChild);
    };
    // 绑定已有槽位删除
    overlay.querySelectorAll('.slot-row').forEach(bindSlotDel);

    // 加载完成动作列表
    api('GET', '/api/tasks/actions', null, function(res) {
      var sel = overlay.querySelector('#tf-action');
      if (!sel) return;
      var actions = (res.success && res.data && res.data.length) ? res.data : ['complete_message'];
      sel.innerHTML = actions.map(function(a) {
        return '<option value="' + esc(a) + '">' + esc(a) + '</option>';
      }).join('');
      if (isEdit && task.on_complete && actions.indexOf(task.on_complete) >= 0) sel.value = task.on_complete;
    });

    // v2 步骤编辑器
    overlay.querySelector('#tf-add-step').onclick = function() {
      var container = overlay.querySelector('#tf-steps');
      container.insertAdjacentHTML('beforeend', buildOneStepRow({key:'',type:'collect',next:''}));
      bindStepRowEvents(container.lastElementChild);
    };
    overlay.querySelector('#tf-auto-steps').onclick = autoGenerateSteps;
    overlay.querySelectorAll('#tf-steps .step-row').forEach(bindStepRowEvents);

    // 保存
    overlay.querySelector('#tf-save').onclick = function() {
      var code = overlay.querySelector('#tf-code').value.trim();
      var name = overlay.querySelector('#tf-name').value.trim();
      if (!code || !name) { alert('编码和名称不能为空'); return; }
      // 收集关键词
      var keywords = [];
      overlay.querySelectorAll('#tf-keywords .keyword-tag').forEach(function(tag) {
        keywords.push(tag.getAttribute('data-value'));
      });
      // 收集意图例句
      var examples = [];
      overlay.querySelectorAll('#tf-examples .keyword-tag').forEach(function(tag) {
        examples.push(tag.getAttribute('data-value'));
      });
      // 收集槽位
      var slots = [];
      overlay.querySelectorAll('#tf-slots .slot-row').forEach(function(row) {
        var key = row.querySelector('.slot-key').value.trim();
        var label = row.querySelector('.slot-label').value.trim();
        if (!key || !label) return;
        slots.push({
          key: key,
          label: label,
          prompt: row.querySelector('.slot-prompt').value.trim(),
          extract_type: row.querySelector('.slot-type').value,
          extract_rule: row.querySelector('.slot-rule').value.trim(),
          required: row.querySelector('.slot-required').checked,
        });
      });
      var steps = collectStepRows();
      var data = {
        code: code,
        name: name,
        description: overlay.querySelector('#tf-desc').value.trim(),
        trigger_keywords: keywords,
        slots: slots,
        steps: steps.length ? steps : undefined,
        intent_examples: examples.length ? examples : undefined,
        completion_message: overlay.querySelector('#tf-action-msg').value.trim() || overlay.querySelector('#tf-complete').value.trim(),
        on_complete: overlay.querySelector('#tf-action').value || '',
        status: 1,
      };
      api('POST', '/api/tasks', data, function(res) {
        if (res.success) {
          overlay.remove();
          loadTasks();
        } else {
          alert(res.message || '保存失败');
        }
      });
    };
  }

  function buildKeywordTags(keywords) {
    if (!keywords || !keywords.length) return '<span style="color:#999;font-size:12px">暂无关键词</span>';
    return keywords.map(function(k) {
      var val = typeof k === 'string' ? k : (k.regex || '');
      return '<span class="keyword-tag" data-value="' + esc(val) + '">' + esc(val) + '<span class="remove">&times;</span></span>';
    }).join('');
  }

  function buildExampleTags(examples) {
    if (!examples || !examples.length) return '<span style="color:#999;font-size:12px">暂无例句（将自动使用触发词）</span>';
    return examples.map(function(e) {
      return '<span class="keyword-tag" data-value="' + esc(e) + '">' + esc(e) + '<span class="remove">&times;</span></span>';
    }).join('');
  }

  function buildSlotRows(slots) {
    if (!slots || !slots.length) return '<div style="color:#999;font-size:12px;padding:8px">暂无槽位，点击下方添加</div>';
    return slots.map(function(s) { return buildOneSlotRow(s); }).join('');
  }

  function buildOneSlotRow(s) {
    return '<div class="slot-row">' +
      '<input class="slot-key" value="' + esc(s.key||'') + '" placeholder="字段名">' +
      '<input class="slot-label" value="' + esc(s.label||'') + '" placeholder="显示名">' +
      '<input class="slot-prompt" value="' + esc(s.prompt||'') + '" placeholder="提问话术">' +
      '<select class="slot-type">' +
        '<option value="text"' + (s.extract_type==='text'?' selected':'') + '>文本</option>' +
        '<option value="regex"' + (s.extract_type==='regex'?' selected':'') + '>正则</option>' +
        '<option value="number"' + (s.extract_type==='number'?' selected':'') + '>数字</option>' +
        '<option value="enum"' + (s.extract_type==='enum'?' selected':'') + '>枚举</option>' +
      '</select>' +
      '<input class="slot-rule" value="' + esc(s.extract_rule||'') + '" placeholder="提取规则" style="width:120px">' +
      '<label class="slot-required"><input type="checkbox"' + (s.required!==false?' checked':'') + '>必填</label>' +
      '<button class="slot-del">&times;</button>' +
    '</div>';
  }

  function bindSlotDel(row) {
    var del = row.querySelector('.slot-del');
    if (del) del.onclick = function() { row.remove(); };
  }

  // ===== v2 步骤 DSL 编辑器 =====
  function buildStepRows(steps) {
    if (!steps || !steps.length) return '<div style="color:#999;font-size:12px;padding:8px">暂无步骤，点击"从槽位自动生成"一键生成</div>';
    return steps.map(function(s) { return buildOneStepRow(s); }).join('');
  }

  function buildOneStepRow(s) {
    s = s || {};
    var collectExtra = s.type === 'collect' ?
      '<input class="step-slot" value="' + esc(s.slot_key||'') + '" placeholder="槽位key" style="width:90px">' +
      '<input class="step-prompt" value="' + esc(s.prompt||'') + '" placeholder="提问话术">' +
      '<input class="step-extract" value="' + esc((s.extract&&s.extract.method)||'') + '" placeholder="提取:text/regex/number/enum" style="width:120px">' +
      '<input class="step-rule" value="' + esc((s.extract&&s.extract.rule)||'') + '" placeholder="提取规则/枚举" style="width:110px">' +
      '<input class="step-validate" value="' + esc((s.validate&&s.validate.rule)||'') + '" placeholder="校验规则" style="width:100px">' +
      '<input class="step-reask" value="' + esc((s.validate&&s.validate.reask)||'') + '" placeholder="重问话术" style="width:130px">' : '';
    var actionExtra = s.type === 'action' ?
      '<input class="step-action" value="' + esc(s.action||'') + '" placeholder="动作名" style="width:130px">' +
      '<input class="step-msg" value="' + esc(s.done_message||'') + '" placeholder="完成话术">' : '';
    var subtaskExtra = s.type === 'subtask' ?
      '<input class="step-task" value="' + esc(s.task||'') + '" placeholder="子任务code">' +
      '<input class="step-return" value="' + esc(s.on_return||'') + '" placeholder="返回步骤">' : '';
    var messageExtra = s.type === 'message' ?
      '<input class="step-text" value="' + esc(s.text||'') + '" placeholder="回复内容">' : '';
    var branchExtra = s.type === 'branch' ?
      '<textarea class="step-cases" rows="1" placeholder=\'[{"when":{"slot":"type","op":"eq","value":"漏水"},"next":"leak"}]\'>' + esc(JSON.stringify(s.cases||[])) + '</textarea>' +
      '<input class="step-default" value="' + esc(s.default_next||'') + '" placeholder="默认下一步" style="width:110px">' : '';
    return '<div class="step-row">' +
      '<input class="step-key" value="' + esc(s.key||'') + '" placeholder="步骤key" style="width:100px">' +
      '<select class="step-type">' +
        '<option value="collect"' + (s.type==='collect'?' selected':'') + '>收集</option>' +
        '<option value="confirm"' + (s.type==='confirm'?' selected':'') + '>确认</option>' +
        '<option value="action"' + (s.type==='action'?' selected':'') + '>动作</option>' +
        '<option value="subtask"' + (s.type==='subtask'?' selected':'') + '>子任务</option>' +
        '<option value="branch"' + (s.type==='branch'?' selected':'') + '>分支</option>' +
        '<option value="message"' + (s.type==='message'?' selected':'') + '>回复</option>' +
      '</select>' +
      '<input class="step-next" value="' + esc(s.next||'') + '" placeholder="下一步" style="width:90px">' +
      collectExtra + actionExtra + subtaskExtra + messageExtra + branchExtra +
      '<button class="step-up" title="上移">↑</button><button class="step-down" title="下移">↓</button><button class="step-del" title="删除">&times;</button>' +
    '</div>';
  }

  function bindStepRowEvents(row) {
    var del = row.querySelector('.step-del');
    if (del) del.onclick = function() { row.remove(); };
    var up = row.querySelector('.step-up');
    if (up) up.onclick = function() {
      var prev = row.previousElementSibling;
      if (prev && prev.classList.contains('step-row')) row.parentNode.insertBefore(row, prev);
    };
    var down = row.querySelector('.step-down');
    if (down) down.onclick = function() {
      var next = row.nextElementSibling;
      if (next && next.classList.contains('step-row')) row.parentNode.insertBefore(next, row);
    };
    // 类型切换：重读全部步骤、更新该行类型后整体重渲染
    var typeSel = row.querySelector('.step-type');
    if (typeSel) typeSel.onchange = function() {
      var steps = collectStepRows();
      var idx = Array.prototype.indexOf.call(row.parentNode.children, row);
      if (idx >= 0 && steps[idx]) steps[idx].type = typeSel.value;
      var container = document.getElementById('tf-steps');
      container.innerHTML = buildStepRows(steps);
      container.querySelectorAll('.step-row').forEach(bindStepRowEvents);
    };
  }

  function collectStepRows() {
    var steps = [];
    document.querySelectorAll('#tf-steps .step-row').forEach(function(row) {
      var key = row.querySelector('.step-key').value.trim();
      var type = row.querySelector('.step-type').value;
      if (!key) return;
      var step = { key: key, type: type, next: row.querySelector('.step-next').value.trim() || undefined };
      if (type === 'collect') {
        step.slot_key = (row.querySelector('.step-slot').value || key).trim();
        step.prompt = row.querySelector('.step-prompt').value.trim();
        step.extract = { method: row.querySelector('.step-extract').value.trim() || 'text', rule: row.querySelector('.step-rule').value.trim() };
        var vr = row.querySelector('.step-validate').value.trim();
        var vk = row.querySelector('.step-reask').value.trim();
        if (vr) step.validate = { rule: vr, reask: vk };
      } else if (type === 'action') {
        step.action = row.querySelector('.step-action').value.trim() || 'complete_message';
        var dm = row.querySelector('.step-msg').value.trim();
        if (dm) step.done_message = dm;
      } else if (type === 'subtask') {
        step.task = row.querySelector('.step-task').value.trim();
        step.on_return = row.querySelector('.step-return').value.trim();
      } else if (type === 'message') {
        step.text = row.querySelector('.step-text').value.trim();
      } else if (type === 'branch') {
        try { step.cases = JSON.parse(row.querySelector('.step-cases').value || '[]'); } catch(e) { step.cases = []; }
        step.default_next = row.querySelector('.step-default').value.trim() || undefined;
      }
      steps.push(step);
    });
    return steps;
  }

  // 从槽位自动生成：收集 → 确认 → 动作
  function autoGenerateSteps() {
    var slots = [];
    document.querySelectorAll('#tf-slots .slot-row').forEach(function(row) {
      var key = row.querySelector('.slot-key').value.trim();
      var label = row.querySelector('.slot-label').value.trim();
      if (!key || !label) return;
      slots.push({
        key: key, label: label,
        prompt: row.querySelector('.slot-prompt').value.trim(),
        extract_type: row.querySelector('.slot-type').value,
        extract_rule: row.querySelector('.slot-rule').value.trim(),
        required: row.querySelector('.slot-required').checked,
      });
    });
    var action = document.getElementById('tf-action').value || 'complete_message';
    var msg = document.getElementById('tf-action-msg').value.trim();
    var steps = [];
    slots.forEach(function(s, i) {
      steps.push({
        key: 'collect_' + s.key, type: 'collect', slot_key: s.key, label: s.label, required: s.required !== false,
        prompt: s.prompt || ('请提供' + s.label),
        extract: { method: s.extract_type || 'text', rule: s.extract_rule || '' },
        next: i < slots.length - 1 ? 'collect_' + slots[i+1].key : 'confirm_step',
      });
    });
    if (slots.length) steps.push({ key: 'confirm_step', type: 'confirm', next: 'submit' });
    steps.push({ key: 'submit', type: 'action', action: action, done_message: msg });
    var container = document.getElementById('tf-steps');
    container.innerHTML = buildStepRows(steps);
    container.querySelectorAll('.step-row').forEach(bindStepRowEvents);
  }

  // ===== 删除任务 =====
  window.deleteTask = function(code) {
    if (!confirm('确定要删除任务「' + code + '」吗？')) return;
    api('DELETE', '/api/tasks/' + code, null, function(res) {
      if (res.success) loadTasks();
      else alert(res.message || '删除失败');
    });
  };

  // ===== 启用/禁用 =====
  window.toggleTask = function(code, status) {
    api('POST', '/api/tasks/' + code + '/toggle', {status: !!status}, function(res) {
      if (res.success) loadTasks();
    });
  };

  // ===== 通用 API 请求 =====
  function api(method, url, data, cb) {
    var xhr = new XMLHttpRequest();
    xhr._isLoginReq = true; // 避免被 auth 拦截器循环
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    // 注入 token
    try {
      var token = localStorage.getItem('faq_admin_token');
      if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    } catch(e) {}
    xhr.onload = function() {
      try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({success:false, message:'解析响应失败'}); }
    };
    xhr.onerror = function() { cb({success:false, message:'网络错误'}); };
    xhr.send(data ? JSON.stringify(data) : null);
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
})();
</script>
</body>
</html>
