<body>
  <!-- 聊天预览右侧面板 -->
  <div id="chat-preview-panel">
    <div id="chat-preview-resize"></div>
    <div id="chat-preview-header">
      <h3>💬 聊天预览</h3>
      <button class="close-btn" id="chat-preview-close">&times;</button>
    </div>
    <iframe id="chat-preview-iframe" src="about:blank"></iframe>
  </div>

  <div id="app"></div>

  <!-- 认证层：登录 + XHR 拦截 -->
  <div id="auth-overlay">
    <div class="auth-card">
      <div class="logo">🤖</div>
      <h2>FAQ 管理后台</h2>
      <p class="subtitle">请登录以继续</p>
      <form id="auth-form">
        <div class="field">
          <label for="auth-username">用户名</label>
          <input type="text" id="auth-username" placeholder="请输入用户名" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="auth-password">密码</label>
          <input type="password" id="auth-password" placeholder="请输入密码" autocomplete="current-password" required />
        </div>
        <button type="submit" class="login-btn" id="auth-submit">登 录</button>
        <div class="error-msg" id="auth-error"></div>
      </form>
    </div>
  </div>

  <script>
  (function() {
    'use strict';
    var TOKEN_KEY = 'faq_admin_token';
    var overlay = document.getElementById('auth-overlay');
    var form = document.getElementById('auth-form');
    var errEl = document.getElementById('auth-error');
    var submitBtn = document.getElementById('auth-submit');

    // ===== Token 管理 =====
    function getToken() {
      try { return localStorage.getItem(TOKEN_KEY); } catch(e) { return null; }
    }
    function setToken(t) {
      try { localStorage.setItem(TOKEN_KEY, t); } catch(e) {}
    }
    function clearToken() {
      try { localStorage.removeItem(TOKEN_KEY); } catch(e) {}
    }

    // ===== 显示/隐藏登录 =====
    function showLogin() {
      overlay.classList.remove('hidden');
    }
    function hideLogin() {
      overlay.classList.add('hidden');
    }

    // ===== 登录请求 =====
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var username = document.getElementById('auth-username').value.trim();
      var password = document.getElementById('auth-password').value;
      if (!username || !password) {
        errEl.textContent = '请输入用户名和密码';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '登录中...';
      errEl.textContent = '';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/auth/login', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      // 标记这是登录请求，避免被拦截器循环调用
      xhr._isLoginReq = true;
      xhr.onload = function() {
        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
        if (xhr.status === 200) {
          try {
            var res = JSON.parse(xhr.responseText);
            if (res.success && res.token) {
              setToken(res.token);
              hideLogin();
              // 触发页面刷新让 Vue 重新加载
              window.location.reload();
              return;
            }
          } catch(ex) {}
          errEl.textContent = '登录响应异常';
        } else if (xhr.status === 401) {
          errEl.textContent = '用户名或密码错误';
        } else {
          errEl.textContent = '登录失败，请重试';
        }
        document.getElementById('auth-password').value = '';
        document.getElementById('auth-password').focus();
      };
      xhr.onerror = function() {
        submitBtn.disabled = false;
        submitBtn.textContent = '登 录';
        errEl.textContent = '网络错误，请检查服务是否运行';
      };
      xhr.send(JSON.stringify({ username: username, password: password }));
    });

    // ===== Monkey-patch XMLHttpRequest 注入 Authorization =====
    var OrigXHR = XMLHttpRequest;
    var origOpen = OrigXHR.prototype.open;
    var origSend = OrigXHR.prototype.send;
    var origSetRequestHeader = OrigXHR.prototype.setRequestHeader;

    OrigXHR.prototype.open = function(method, url) {
      this._authUrl = url;
      return origOpen.apply(this, arguments);
    };

    OrigXHR.prototype.send = function() {
      var token = getToken();
      var self = this;

      // 如果是登录请求，不注入 token
      if (this._isLoginReq) {
        return origSend.apply(this, arguments);
      }

      // 如果有 token 且是 API 请求，注入 Authorization
      if (token && this._authUrl && this._authUrl.indexOf('/api/') === 0) {
        try { origSetRequestHeader.call(this, 'Authorization', 'Bearer ' + token); } catch(e) {}
      }

      // 监听 401 响应
      var origOnload = this.onload;
      var origOnreadystatechange = this.onreadystatechange;

      function check401() {
        if (self.status === 401 && self._authUrl && self._authUrl.indexOf('/api/') === 0) {
          clearToken();
          showLogin();
        }
      }

      if (origOnload) {
        this.onload = function() {
          check401();
          return origOnload.apply(this, arguments);
        };
      }
      if (origOnreadystatechange) {
        this.onreadystatechange = function() {
          if (self.readyState === 4) check401();
          return origOnreadystatechange.apply(this, arguments);
        };
      }
      if (!origOnload && !origOnreadystatechange) {
        this.addEventListener('load', check401);
      }

      return origSend.apply(this, arguments);
    };

    // ===== 同时拦截 fetch（以防部分代码使用 fetch）=====
    var origFetch = window.fetch;
    if (origFetch) {
      window.fetch = function(input, init) {
        var token = getToken();
        var url = typeof input === 'string' ? input : (input && input.url) || '';

        if (token && url.indexOf('/api/') === 0) {
          init = init || {};
          init.headers = init.headers || {};
          if (init.headers instanceof Headers) {
            if (!init.headers.has('Authorization')) {
              init.headers.set('Authorization', 'Bearer ' + token);
            }
          } else if (typeof init.headers === 'object') {
            if (!init.headers['Authorization']) {
              init.headers['Authorization'] = 'Bearer ' + token;
            }
          }
        }

        return origFetch.call(this, input, init).then(function(resp) {
          if (resp.status === 401 && url.indexOf('/api/') === 0) {
            clearToken();
            showLogin();
          }
          return resp;
        });
      };
    }

    // ===== 启动检查 =====
    if (getToken()) {
      // 验证 token 是否仍然有效
      var verifyXhr = new OrigXHR();
      verifyXhr._isLoginReq = true;
      verifyXhr.open('GET', '/api/auth/verify', true);
      verifyXhr.setRequestHeader('Authorization', 'Bearer ' + getToken());
      verifyXhr.onload = function() {
        if (verifyXhr.status === 200) {
          try {
            var res = JSON.parse(verifyXhr.responseText);
            if (res.valid) { hideLogin(); return; }
          } catch(e) {}
        }
        clearToken();
        showLogin();
      };
      verifyXhr.onerror = function() {
        // 网络错误时也显示登录
        showLogin();
      };
      verifyXhr.send();
    } else {
      showLogin();
    }

    // ===== 表格列宽修正 =====
    // Element Plus el-table-column 的 width 百分比值会被当作像素写入 colgroup
    // 此函数读取 col 的像素值作为比例，按容器实际宽度重新分配
    function setTableColumnWidths() {
      var tables = document.querySelectorAll('.el-table');
      tables.forEach(function(table) {
        var headerTable = table.querySelector('.el-table__header-wrapper table');
        if (!headerTable) return;
        var cols = headerTable.querySelectorAll('col');
        if (!cols.length) return;
        var containerWidth = table.clientWidth;
        if (containerWidth <= 0) return;
        // 收集每列的原始值（Element Plus 把百分比当像素写入 col width）
        var ratios = [];
        var totalRatio = 0;
        for (var i = 0; i < cols.length; i++) {
          var w = parseFloat(cols[i].getAttribute('width') || '0');
          ratios.push(w);
          totalRatio += w;
        }
        if (totalRatio <= 0) return;
        // 检查是否已经正确设置（避免重复计算）
        var firstColWidth = parseFloat(cols[0].getAttribute('width') || '0');
        var expectedFirst = Math.round((ratios[0] / totalRatio) * containerWidth);
        if (expectedFirst < 40) expectedFirst = 40;
        if (Math.abs(firstColWidth - expectedFirst) < 2) return; // 已正确，跳过
        // 按比例重新分配实际像素宽度
        var bodyTable = table.querySelector('.el-table__body-wrapper table');
        var bodyCols = bodyTable ? bodyTable.querySelectorAll('col') : [];
        var headerCells = headerTable.querySelectorAll('th');
        // 修正 body table 的内联宽度（Element Plus 设为错误的像素值）
        if (bodyTable) bodyTable.style.width = containerWidth + 'px';
        for (var i = 0; i < cols.length; i++) {
          var px = Math.round((ratios[i] / totalRatio) * containerWidth);
          if (px < 40) px = 40;
          cols[i].setAttribute('width', px);
          if (bodyCols[i]) bodyCols[i].setAttribute('width', px);
          if (headerCells[i]) headerCells[i].style.width = px + 'px';
        }
      });
    }
    // 持续轮询修正表格列宽（Element Plus 虚拟 DOM 会覆盖直接修改）
    setInterval(setTableColumnWidths, 500);
    setTimeout(setTableColumnWidths, 200);

    // ===== 修复分类树重复 header =====
    function fixDuplicateHeader() {
      var panels = document.querySelectorAll('.category-tree');
      panels.forEach(function(panel) {
        var inner = panel.querySelector('.category-tree');
        if (inner) {
          var header = inner.querySelector('.tree-header');
          if (header) header.style.display = 'none';
        }
      });
    }
    var observer = new MutationObserver(fixDuplicateHeader);
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });
    setTimeout(fixDuplicateHeader, 500);
    setTimeout(fixDuplicateHeader, 1500);
  })();
  </script>
<script>
(function(){
  var reqVisible=true, rateVisible=true;
  function updateLegend(){
    var reqEl=document.querySelector('.legend-req');
    var rateEl=document.querySelector('.legend-rate');
    if(reqEl) reqEl.classList.toggle('disabled',!reqVisible);
    if(rateEl) rateEl.classList.toggle('disabled',!rateVisible);
  }
  function updateBars(){
    document.querySelectorAll('.trend-bar:not(.trend-bar-rate)').forEach(function(b){
      b.classList.toggle('hidden',!reqVisible);
    });
    document.querySelectorAll('.trend-bar-rate').forEach(function(b){
      b.classList.toggle('hidden',!rateVisible);
    });
  }
  document.addEventListener('click',function(e){
    var target=e.target.closest('.legend-item');
    if(!target) return;
    if(target.classList.contains('legend-req')){
      reqVisible=!reqVisible;
      updateLegend();
      updateBars();
    } else if(target.classList.contains('legend-rate')){
      rateVisible=!rateVisible;
      updateLegend();
      updateBars();
    }
  });
})();
</script>
<script>
// ===== 聊天预览右侧面板 =====
(function(){
  var panel = document.getElementById('chat-preview-panel');
  var iframe = document.getElementById('chat-preview-iframe');
  var closeBtn = document.getElementById('chat-preview-close');
  var resizeHandle = document.getElementById('chat-preview-resize');
  var isOpen = false;

  function openPreview() {
    if (!isOpen) {
      iframe.src = '/';
      panel.classList.add('show');
      isOpen = true;
    }
  }
  function closePreview() {
    panel.classList.remove('show');
    iframe.src = 'about:blank';
    isOpen = false;
  }

  closeBtn.addEventListener('click', closePreview);

  // 拖拽调整宽度
  var resizing = false, startX = 0, startW = 0;
  resizeHandle.addEventListener('mousedown', function(e) {
    resizing = true;
    startX = e.clientX;
    startW = panel.offsetWidth;
    resizeHandle.classList.add('active');
    e.preventDefault();
  });
  document.addEventListener('mousemove', function(e) {
    if (!resizing) return;
    var newW = startW + (startX - e.clientX);
    if (newW >= 300 && newW <= window.innerWidth * 0.7) {
      panel.style.width = newW + 'px';
    }
  });
  document.addEventListener('mouseup', function() {
    if (resizing) { resizing = false; resizeHandle.classList.remove('active'); }
  });

  // 拦截"聊天预览"菜单项的点击
  document.addEventListener('click', function(e) {
    var menuItem = e.target.closest('.el-menu-item');
    if (menuItem && menuItem.textContent.trim() === '聊天预览') {
      e.preventDefault();
      e.stopPropagation();
      openPreview();
    }
  }, true);
})();
// ===== 规则引擎页面 - 任务管理标签页 =====
(function(){
  var injected = false;
  var observer = new MutationObserver(function(){
    if (injected) return;
    var panel = document.querySelector('.config-panel');
    if (!panel) return;
    // 检查是否已在规则引擎页面（通过内容判断）
    var h3 = panel.querySelector('h3');
    if (!h3 || h3.textContent.indexOf('对话规则') === -1) return;
    injected = true;
    injectTaskTabs(panel);
  });
  observer.observe(document.getElementById('app'), { childList: true, subtree: true });

  // 监听路由变化，重置注入标记
  var lastHref = location.href;
  setInterval(function(){
    if (location.href !== lastHref) {
      lastHref = location.href;
      injected = false;
    }
  }, 300);

  function injectTaskTabs(panel) {
    // 创建标签导航（对话规则 | 任务流程 | LLM 智能层）
    var tabs = document.createElement('div');
    tabs.id = 'rules-tabs';
    tabs.innerHTML = '<button class="tab-btn active" data-tab="rules">对话规则</button><button class="tab-btn" data-tab="tasks">任务流程</button><button class="tab-btn" data-tab="llm">LLM 智能层</button>';
    // 把原有内容包进 tab panel
    var rulesPanel = document.createElement('div');
    rulesPanel.className = 'tab-panel active';
    rulesPanel.id = 'tab-rules';
    while (panel.firstChild) rulesPanel.appendChild(panel.firstChild);
    // 创建任务面板
    var tasksPanel = document.createElement('div');
    tasksPanel.className = 'tab-panel';
    tasksPanel.id = 'tab-tasks';
    tasksPanel.innerHTML = buildTaskPanelHTML();
    // 创建 LLM 智能层面板
    var llmPanel = document.createElement('div');
    llmPanel.className = 'tab-panel';
    llmPanel.id = 'tab-llm';
    llmPanel.innerHTML = buildLLMPanelHTML();
    // 组装
    panel.appendChild(tabs);
    panel.appendChild(rulesPanel);
    panel.appendChild(tasksPanel);
    panel.appendChild(llmPanel);
    // 对话规则 tab 底部追加"匹配容错"配置区
    injectMatchTolerance(rulesPanel);
    // 标签切换
    tabs.addEventListener('click', function(e) {
      var btn = e.target.closest('.tab-btn');
      if (!btn) return;
      tabs.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active') });
      btn.classList.add('active');
      var tab = btn.getAttribute('data-tab');
      rulesPanel.classList.toggle('active', tab === 'rules');
      tasksPanel.classList.toggle('active', tab === 'tasks');
      llmPanel.classList.toggle('active', tab === 'llm');
      if (tab === 'tasks') { loadTasks(); }
      if (tab === 'llm') loadLLMPanel();
    });
  }

  // ===== 问题追踪页：注入「表达挖掘」子页签 =====
  // （原在规则引擎→任务流程 tab，已移至问题追踪页）
  (function(){
    var issuesInjected = false;
    var observer = new MutationObserver(function(){
      if (issuesInjected) return;
      var tabbar = document.querySelector('.sub-tab-bar');
      if (!tabbar) return;
      if (tabbar.textContent.indexOf('未匹配') === -1) return;
      issuesInjected = true;
      injectSuggestTab(tabbar);
    });
    observer.observe(document.getElementById('app'), { childList: true, subtree: true });
    var lastHref3 = location.href;
    setInterval(function(){
      if (location.href !== lastHref3) { lastHref3 = location.href; issuesInjected = false; }
    }, 300);

    function injectSuggestTab(tabbar) {
      // 样式（原生 .sub-tab 带 scoped 属性，注入元素不命中，需补）
      var st = document.createElement('style');
      st.textContent =
        '#suggest-issues-tab{padding:10px 20px;cursor:pointer;font-size:14px;color:#666;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s}' +
        '#suggest-issues-tab:hover{color:#4361ee}' +
        '#suggest-issues-tab.active{color:#4361ee;border-bottom-color:#4361ee;font-weight:600}' +
        '.sub-tab-bar.issues-suggest-mode .sub-tab.active:not(#suggest-issues-tab){color:#666;border-bottom-color:transparent;font-weight:400}';
      document.head.appendChild(st);

      // 1) 追加子页签
      var myTab = document.createElement('div');
      myTab.className = 'sub-tab';
      myTab.id = 'suggest-issues-tab';
      myTab.textContent = '🔍 表达挖掘';
      tabbar.appendChild(myTab);

      // 2) 面板（追加到页面根，原生面板之后）
      var panel = document.createElement('div');
      panel.id = 'suggest-issues-panel';
      panel.style.cssText = 'padding:16px 0';
      panel.innerHTML =
        '<div class="task-header"><h4>表达挖掘（未触发任务的高频话术）</h4>' +
          '<button class="btn-sm" id="suggest-issues-refresh">⟳ 重新挖掘</button></div>' +
        '<div style="color:#999;font-size:12px;margin:4px 0 8px">从真实对话日志中找出表达了办理意图但没触发任务的话术，匹配到任务后可一键采纳为意图例句。机器只推荐，由运营确认。</div>' +
        '<div id="suggest-issues-area"><div class="task-empty"><div class="icon">🔍</div><div>加载中...</div></div></div>';
      panel.style.display = 'none';
      tabbar.parentNode.appendChild(panel);
      var area = document.getElementById('suggest-issues-area');

      // 3) 页签切换：原生页签 → 原生面板；我们的页签 → 表达挖掘
      tabbar.addEventListener('click', function(e) {
        var t = e.target && e.target.closest ? e.target.closest('.sub-tab') : null;
        if (!t) return;
        var isMine = (t === myTab);
        var children = Array.prototype.slice.call(tabbar.parentNode.children);
        var start = children.indexOf(tabbar);
        for (var i = start + 1; i < children.length; i++) {
          children[i].style.display = (children[i] === panel) ? (isMine ? '' : 'none') : (isMine ? 'none' : '');
        }
        if (isMine) {
          tabbar.querySelectorAll('.sub-tab').forEach(function(x){ x.classList.remove('active'); });
          myTab.classList.add('active');
          tabbar.classList.add('issues-suggest-mode'); // 压平原生 active 高亮
          loadSuggestions(area);
        } else {
          myTab.classList.remove('active');
          tabbar.classList.remove('issues-suggest-mode');
        }
      });

      // 4) 重新挖掘按钮
      document.getElementById('suggest-issues-refresh').onclick = function(){ loadSuggestions(area); };
    }
  })();

  // 对话规则 tab：匹配容错参数（确认/否认/无意义词的容错匹配判定）
  function ensureTipStyle() {
    if (document.getElementById('arb-tip-style')) return;
    var st = document.createElement('style');
    st.id = 'arb-tip-style';
    st.textContent =
      '.arb-tip{position:relative;display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;background:#4361ee;color:#fff;font-size:11px;font-weight:bold;cursor:help;margin-left:6px;vertical-align:middle}' +
      '.arb-tip .arb-tip-box{visibility:hidden;opacity:0;position:absolute;left:24px;top:-8px;width:300px;background:#2b2f3a;color:#e8eaed;font-size:12px;line-height:1.7;font-weight:normal;padding:12px 14px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9999;transition:opacity .15s,visibility .15s;white-space:normal;text-align:left}' +
      '.arb-tip:hover .arb-tip-box{visibility:visible;opacity:1}' +
      '.arb-tip .arb-tip-box::after{content:"";position:absolute;left:-6px;top:14px;border:6px solid transparent;border-right-color:#2b2f3a}';
    document.head.appendChild(st);
  }

  function injectMatchTolerance(panel) {
    ensureTipStyle();
    var div = document.createElement('div');
    div.id = 'match-tolerance-block';
    div.style.cssText = 'margin-top:30px;max-width:500px';
    div.innerHTML =
      '<h3 style="font-size:15px;margin-bottom:16px">匹配容错参数</h3>' +
      '<div style="font-size:12px;color:#999;margin-bottom:12px">确认/否认/无意义等短词的容错匹配：包含匹配与编辑距离模糊匹配的判定参数。保存立即生效。</div>' +
      '<div id="match-tolerance-form"></div>' +
      '<button id="mt-save-btn" style="padding:8px 20px;background:#4361ee;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;margin-top:8px">保存容错参数</button>';
    panel.appendChild(div);
    renderMatchTolerance();
  }

  function renderMatchTolerance() {
    var box = document.getElementById('match-tolerance-form');
    if (!box) return;
    api('GET', '/api/dialogue-rules', null, function(rules) {
      if (!rules) return;
      ensureTipStyle();
      var mt = rules.matchTolerance || {};
      var row = function(label, id, val, desc, o) {
        o = o || {};
        return '<div style="margin-bottom:18px">' +
          '<div style="font-size:13px;color:#555;margin-bottom:6px">' + label +
            ' <span style="color:#999;font-weight:normal">（当前 ' + val + '）</span>' +
            '<span class="arb-tip">?<span class="arb-tip-box">' + desc + '</span></span>' +
          '</div>' +
          '<input id="' + id + '" type="number" step="' + (o.step || '0.01') + '" min="' + (o.min || 0) + '" max="' + (o.max || 1) + '" value="' + val + '" style="width:140px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">' +
        '</div>';
      };
      box.innerHTML =
        row('包含匹配长度上限', 'mt-contains-max-len', mt.containsMaxLen,
          '作用：文本长度不超过此值时才做"包含匹配"（如"对的对的"包含"对的"）。<br>调大：更长的话也能被包含匹配；调小：只对更短的话生效。<br>典型值：8~15，建议 10。', { min: 2, max: 30, step: 1 }) +
        row('包含匹配权重', 'mt-contains-weight', mt.containsWeight,
          '作用：包含命中时的权重系数（低于精确匹配 1.0，避免误判）。<br>调大：包含命中更接近精确匹配；调小：更保守。<br>典型值：0.6~0.9，建议 0.8。') +
        row('模糊匹配词长上限', 'mt-fuzzy-pattern-max-len', mt.fuzzyPatternMaxLen,
          '作用：规则词长度超过此值不做编辑距离模糊匹配（长词模糊不可靠）。<br>典型值：3~6，建议 4。', { min: 2, max: 10, step: 1 }) +
        row('模糊匹配文本长度上限', 'mt-fuzzy-text-max-len', mt.fuzzyTextMaxLen,
          '作用：用户输入长度超过此值不做模糊匹配。<br>典型值：6~15，建议 10。', { min: 2, max: 30, step: 1 }) +
        row('模糊匹配相似度线', 'mt-fuzzy-sim', mt.fuzzySim,
          '作用：编辑距离相似度 ≥ 此值才算模糊命中（"好滴"≈"好的"）。<br>调大：要求更像才命中；调小：更宽松。<br>典型值：0.7~0.9，建议 0.8。') +
        row('模糊匹配权重', 'mt-fuzzy-weight', mt.fuzzyWeight,
          '作用：模糊命中时的权重系数（低于精确匹配）。<br>典型值：0.5~0.85，建议 0.7。');
      var btn = document.getElementById('mt-save-btn');
      if (btn) btn.onclick = function() {
        var mt = {};
        var ids = {
          'mt-contains-max-len': 'containsMaxLen', 'mt-contains-weight': 'containsWeight',
          'mt-fuzzy-pattern-max-len': 'fuzzyPatternMaxLen', 'mt-fuzzy-text-max-len': 'fuzzyTextMaxLen',
          'mt-fuzzy-sim': 'fuzzySim', 'mt-fuzzy-weight': 'fuzzyWeight'
        };
        for (var id in ids) {
          var el = document.getElementById(id);
          if (!el) continue;
          var v = parseFloat(el.value);
          if (isNaN(v)) { alert('参数格式错误：' + id); return; }
          mt[ids[id]] = v;
        }
        api('POST', '/api/dialogue-rules', { matchTolerance: mt }, function(res) {
          if (res.success) alert('容错参数已保存并生效');
          else alert(res.message || '保存失败');
        });
      };
    });
  }

  // ===== 导航栏「系统配置」页注入仲裁阈值区块 =====
  // 原生 SysConfig 页面渲染"识别参数"（最低置信度/追问阈值/TopK/无意义模式/会话超时），
  // 共用 /api/config。把仲裁阈值 6 项注入到同一页面，集中管理全局业务规则。
  (function(){
    var sysInjected = false;
    var sysObserver = new MutationObserver(function(){
      if (sysInjected) return;
      var panel = document.querySelector('.config-panel');
      if (!panel) return;
      var h3 = panel.querySelector('h3');
      if (!h3 || h3.textContent.indexOf('识别参数') === -1) return;
      sysInjected = true;
      injectArbThresholds(panel);
      injectAdvThresholds(panel);
      injectAnalysisThresholds(panel);
      restructureConfigLayout(panel);
      injectNativeTips(panel);
      placeTopRightSave();
    });
    sysObserver.observe(document.getElementById('app'), { childList: true, subtree: true });

    function injectArbThresholds(panel) {
      ensureArbTipStyle();
      // 追加仲裁阈值区块（插在现有 el-form 之后）
      var div = document.createElement('div');
      div.id = 'arb-threshold-block';
      div.style.cssText = 'margin-top:30px;max-width:500px';
      div.innerHTML =
        '<h3 style="font-size:15px;margin-bottom:16px">任务/FAQ 仲裁阈值</h3>' +
        '<div style="font-size:12px;color:#999;margin-bottom:12px">用户输入同时命中任务和 FAQ 时对比相似度判定通道。保存立即生效；单个任务可在「规则引擎→任务流程」中单独覆盖。</div>' +
        '<div id="arb-threshold-form"></div>';
      panel.appendChild(div);
      renderArbForm();
    }

    function renderArbForm() {
      var box = document.getElementById('arb-threshold-form');
      if (!box) return;
      api('GET', '/api/config', null, function(cfg) {
        if (!cfg) return;
        ensureArbTipStyle();
        var row = function(label, id, val, desc, short) {
          return '<div class="cfg-item">' +
            '<div style="font-size:13px;color:#555;margin-bottom:6px">' + label +
              ' <span style="color:#999;font-weight:normal">（当前 ' + val + '）</span>' +
              '<span class="arb-tip">?<span class="arb-tip-box">' + desc + '</span></span>' +
            '</div>' +
            '<input id="' + id + '" type="number" step="0.01" min="0" max="1" value="' + val + '" style="width:140px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">' +
            (short ? '<div class="cfg-comment">' + short + '</div>' : '') +
          '</div>';
        };
        var html =
          '<div class="cfg-grid">' +
          row('差距阈值', 'arb-gap', cfg.arbGap,
            '作用：决定"任务"和"FAQ"两边相似度差多少时直接判定胜出，而不是追问用户。<br>举例：用户说"我要预约上门服务"，任务侧 0.92、FAQ 侧 0.70，差 0.22 &gt; 0.08 → 直接进入任务。<br>调大：更倾向追问确认（保守）；调小：更倾向直接判定（果断）。<br>典型值：0.06~0.15，建议 0.08。',
            '任务与 FAQ 分数差多少时直接判胜出，不再追问') +
          row('任务侧最低线', 'arb-task-min', cfg.arbTaskMin,
            '作用：任务例句相似度低于此值，就不算"像这个任务"，不会触发任务。<br>举例："习近平是谁"与任务例句最高相似度 0.40 &lt; 0.45 → 不触发任何任务。<br>调大：减少任务误触发（可能漏真实预约）；调小：更容易触发（易误触）。<br>典型值：0.40~0.55，建议 0.45。',
            '任务例句相似度低于此线，不算"像这个任务"') +
          row('FAQ 侧最低线', 'arb-faq-min', cfg.arbFaqMin,
            '作用：FAQ 例句相似度低于此值，就不算"匹配到 FAQ"，不会用 FAQ 回答。<br>举例："今天天气"与所有 FAQ 例句相似度都 &lt; 0.55 → 不匹配 FAQ。<br>调大：减少 FAQ 误匹配（可能漏答）；调小：更容易匹配（易答非所问）。<br>典型值：0.50~0.65，建议 0.55。',
            'FAQ 例句相似度低于此线，不算"匹配到 FAQ"') +
          row('强命中线', 'arb-strong-hit', cfg.arbStrongHit,
            '作用：无触发词时，任务和 FAQ 两侧相似度都低于此值 → 判定"域外问题"（与净水器业务无关），直接业务引导，不追问。<br>举例："我家门坏了"任务 0.64、FAQ 0.61，都 &lt; 0.72 → 域外。<br>调大：更多输入判为域外（严格）；调小：更多弱匹配进澄清。<br>典型值：0.65~0.80，建议 0.72。',
            '两侧都低于此线时判"域外"，直接业务引导') +
          row('语义触发线', 'arb-vector-threshold', cfg.arbVectorThreshold,
            '作用：任务意图例句的向量相似度达到此值，才算"语义命中任务"（触发词没覆盖但说法像例句的场景）。<br>举例："安排人来安装"与例句"我买的净水机，你们派人来安装"相似度 0.73 ≥ 0.45 → 触发预约任务。<br>调大：减少语义误触发；调小：更多口语化表达能触发。<br>典型值：0.40~0.55，建议 0.45。',
            '例句向量达到此线才算"语义命中任务"') +
          row('触发词基础分', 'arb-task-boost', cfg.arbTaskBoost,
            '作用：话术命中任务触发词（如"预约""上门"）时，任务侧相似度抬升到此值——触发词是运营明确配置的信号。<br>举例："请个师父上门来看看吧"命中"上门" → 任务侧抬到 0.85，压过 FAQ 0.72 → 进入预约任务。<br>调大：触发词命中后更坚定走任务；调小：更易被 FAQ 反超。<br>典型值：0.80~0.92，建议 0.85。',
            '命中任务触发词时，任务侧相似度抬升到此分') +
          '</div>' +
          '<div class="cfg-note">以上各分区参数共用右上角"保存配置"按钮，一起保存生效。</div>';
        box.innerHTML = html;
        // 与右上角"保存配置"按钮联动：点击时把仲裁/高级判定/分析建议阈值一并提交
        if (!window.__arbLinked) {
          window.__arbLinked = true;
          document.addEventListener('click', function(e) {
            if (!e.isTrusted) return; // 忽略程序化点击（右上角按钮内部触发原生保存）
            var btn = e.target && e.target.closest ? e.target.closest('button') : null;
            if (!btn) return;
            var isSave = btn.textContent.indexOf('保存配置') >= 0;
            if (!isSave) return;
            // 原生保存触发后（异步），补提交所有注入阈值，并重挂被重渲染清掉的注释
            setTimeout(function() {
              var payload = {};
              var ids = {
                'arb-gap': 'arbGap', 'arb-task-min': 'arbTaskMin', 'arb-faq-min': 'arbFaqMin',
                'arb-strong-hit': 'arbStrongHit', 'arb-vector-threshold': 'arbVectorThreshold', 'arb-task-boost': 'arbTaskBoost',
                'faq-compete-ceiling': 'faqCompeteCeiling', 'faq-compete-gap': 'faqCompeteGap', 'llm-rerank-ceiling': 'llmRerankCeiling',
                'short-text-len': 'shortTextLen', 'short-regex-hit': 'shortRegexHit', 'short-contains-hit': 'shortContainsHit',
                'task-vec-min-len': 'taskVecMinLen',
                'analysis-recommend-threshold': 'analysisRecommendThreshold', 'analysis-max-confidence': 'analysisMaxConfidence',
                'suggest-min-len': 'suggestMinLen', 'suggest-sim-threshold': 'suggestSimThreshold', 'suggest-keyword-min-score': 'suggestKeywordMinScore'
              };
              var any = false;
              for (var id in ids) {
                var el = document.getElementById(id);
                if (!el) continue;
                var v = parseFloat(el.value);
                if (isNaN(v)) { alert('参数格式错误：' + id); return; }
                payload[ids[id]] = v;
                any = true;
              }
              // 固定话术 + 匹配词表（配置驱动，不允许硬编码）
              var tp = collectTextsPayload();
              if (tp === null) return; // 含 emoji 等不支持字符，中止保存
              if (Object.keys(tp.replyTexts).length) { payload.replyTexts = tp.replyTexts; any = true; }
              if (Object.keys(tp.matchVocab).length) { payload.matchVocab = tp.matchVocab; any = true; }
              // LLM 连接（全系统唯一模型控制点）
              var llmConn = {};
              var connEnabled = document.getElementById('llm-conn-enabled');
              if (connEnabled) { llmConn.llmEnabled = connEnabled.checked; any = true; }
              var connUrl = document.getElementById('llm-conn-url');
              if (connUrl && connUrl.value.trim()) { llmConn.llmApiUrl = connUrl.value.trim(); any = true; }
              var connKey = document.getElementById('llm-conn-key');
              if (connKey && connKey.value.trim()) { llmConn.llmApiKey = connKey.value.trim(); any = true; }
              var connModel = document.getElementById('llm-conn-model');
              if (connModel && connModel.value.trim()) { llmConn.llmModel = connModel.value.trim(); any = true; }
              for (var lk in llmConn) payload[lk] = llmConn[lk];
              if (any) {
                api('POST', '/api/config', payload, function(res) {
                  if (!res.success) alert('配置保存失败：' + (res.message || '未知错误'));
                });
              }
              var p = document.querySelector('.config-panel');
              if (p) injectNativeTips(p);
            }, 300);
          });
        }
      });
    }

      llmConn.id = 'cfg-tab-llm';

      // 原生内容（h3 识别参数 + el-form）→ 识别参数面板；三个注入区块 → 各自面板
      while (panel.firstChild) {
        var node = panel.firstChild;
        if (node.id === 'arb-threshold-block') { arb.appendChild(node); node.style.marginTop = '0'; node.style.maxWidth = 'none'; continue; }
        if (node.id === 'adv-threshold-block') { adv.appendChild(node); node.style.marginTop = '0'; node.style.maxWidth = 'none'; continue; }
        if (node.id === 'analysis-threshold-block') { analysis.appendChild(node); node.style.marginTop = '0'; node.style.maxWidth = 'none'; continue; }

      }

      var recogDesc = document.createElement('div');

      recog.insertBefore(recogDesc, recog.querySelector('h3') ? recog.querySelector('h3').nextSibling : recog.firstChild);

      // 组装
      panel.appendChild(tabs);
      panel.appendChild(recog);
      panel.appendChild(arb);
      panel.appendChild(adv);
      panel.appendChild(analysis);
      panel.appendChild(texts);
      panel.appendChild(llmConn);
      renderTextsForm();
      renderLLMConnection();

      // tab 切换
      tabs.addEventListener('click', function(e) {
        var btn = e.target.closest('.cfg-tab-btn');
        if (!btn) return;
        tabs.querySelectorAll('.cfg-tab-btn').forEach(function(b){ b.classList.remove('active') });
        btn.classList.add('active');
        var tab = btn.getAttribute('data-tab');
        [recog, arb, adv, analysis, texts, llmConn].forEach(function(p){ p.classList.toggle('active', p.id === 'cfg-tab-' + tab) });
      });
    }

    function synonymsToText(obj) {
      var lines = [];
      for (var k in obj) {
        if (Array.isArray(obj[k])) lines.push(k + '=' + obj[k].join(','));
      }
      return lines.join('\n');
    }

    function textToSynonyms(txt) {
      var out = {};
      String(txt || '').split('\n').forEach(function(line) {
        line = line.trim();
        if (!line) return;
        var eq = line.indexOf('=');
        if (eq <= 0) return;
        var key = line.slice(0, eq).trim();
        var words = line.slice(eq + 1).split(/[,，]/).map(function(w){ return w.trim(); }).filter(Boolean);
        if (key && words.length) out[key] = words;
      });
      return out;
    }

    // 收集固定话术 + 词表（右上角保存时调用）
    // 4 字节字符（emoji 等）检测：数据库为 utf8mb3（旧 utf8），不支持这类字符，保存前拦截
    function hasNonBmp(str) {
      for (var i = 0; i < str.length; i++) {
        var code = str.charCodeAt(i);
        if (code >= 0xD800 && code <= 0xDBFF) return true; // 高代理对 = 非 BMP（4 字节）字符
      }
      return false;
    }

    // 收集固定话术 + 词表（右上角保存时调用）；含 emoji 等不支持字符时提示并返回 null 中止保存
    function collectTextsPayload() {
      var replyTexts = {};
      var badFields = [];
      TEXT_GROUPS.forEach(function(g) {
        g.keys.forEach(function(k) {
          var el = document.getElementById('rt-' + k[0]);
          if (!el) return;
          var v = el.value.trim();
          if (hasNonBmp(v)) badFields.push(k[1]);
          if (v) replyTexts[k[0]] = v;
        });
      });
      var matchVocab = {};
      var synEl = document.getElementById('mv-synonyms');
      if (synEl) {
        if (hasNonBmp(synEl.value)) badFields.push('触发词近义扩展表');
        matchVocab.triggerSynonyms = textToSynonyms(synEl.value);
      }
      var rtTaskEl = document.getElementById('mv-rt-task');
      if (rtTaskEl) {
        if (hasNonBmp(rtTaskEl.value)) badFields.push('澄清关键词 · 办理');
        var tw = rtTaskEl.value.split(/[,，]/).map(function(w){ return w.trim(); }).filter(Boolean);
        if (tw.length) matchVocab.routeChoiceTask = tw;
      }
      var rtFaqEl = document.getElementById('mv-rt-faq');
      if (rtFaqEl) {
        if (hasNonBmp(rtFaqEl.value)) badFields.push('澄清关键词 · 咨询');
        var fw = rtFaqEl.value.split(/[,，]/).map(function(w){ return w.trim(); }).filter(Boolean);
        if (fw.length) matchVocab.routeChoiceFaq = fw;
      }
      if (badFields.length) {
        alert('以下字段包含不支持的字符（emoji 等特殊符号，数据库为旧版 utf8 不支持）：\n' + badFields.join('、') + '\n请移除后重新保存。');
        return null;
      }
      return { replyTexts, matchVocab };
    }

    // 全局一次注入 tooltip 样式 + 隐藏原生底部保存按钮（CSS 规则跨 Vue 重渲染存活）

    // 右上角"刷新"按钮的位置换成"保存配置"（点击时触发原生保存逻辑）
    function placeTopRightSave() {
      ensureArbTipStyle();
      if (document.getElementById('config-save-top-btn')) return;
      var refreshBtn = null;
      var btns = document.querySelectorAll('button.el-button--small');
      for (var i = 0; i < btns.length; i++) {
        var b = btns[i];
        if (b.closest('.config-panel')) continue;
        if (b.textContent.trim() === '刷新') { refreshBtn = b; break; }
      }
      if (!refreshBtn) return;
      var btn = document.createElement('button');
      btn.id = 'config-save-top-btn';
      btn.className = 'el-button el-button--small el-button--primary';
      btn.textContent = '保存配置';
      btn.style.marginLeft = '8px';
      btn.onclick = function() {
        var native = document.querySelector('.config-panel button.el-button--primary');
        if (native && native.click) native.click();
        else alert('未找到原生保存按钮');
      };
      refreshBtn.parentNode.insertBefore(btn, refreshBtn);
      refreshBtn.remove();
    }

    // 路由变化时重置（进入/离开 /config 页面）
    var lastHref2 = location.href;
    setInterval(function(){
      if (location.href !== lastHref2) {
        lastHref2 = location.href;
        sysInjected = false;
      }
      // 兜底：仍在配置页但右上角保存按钮被重渲染清掉时，重新放回
      if (document.getElementById('config-save-top-btn')) return;
      var panel = document.querySelector('.config-panel');
      if (!panel) return;
      var h3 = panel.querySelector('h3');
      if (h3 && h3.textContent.indexOf('识别参数') !== -1) placeTopRightSave();
    }, 300);
  })();

  function renderLLMNodes() {
    var box = document.getElementById('llm-nodes');
    if (!box) return;
    api('GET', '/api/config', null, function(cfg) {
      if (!cfg) return;
      var nodes = cfg.llmNodes || {};
      var html = '<h4 style="font-size:14px;color:#4361ee;margin:0 0 6px">LLM 调用节点</h4>' +
        '<div style="font-size:12px;color:#999;margin-bottom:12px">每个"要用 LLM 的环节"是一个节点：可独立开关、配置模型（留空=全局模型）、温度、最大 token。保存即生效；关闭的节点自动降级为规则/不调用。</div>' +
        '<div class="texts-grid">';
      LLM_NODES_META.forEach(function(m) {
        var n = nodes[m.key] || {};
        html += '<div class="text-group"><h4>' + m.name + '</h4>' +
          '<div class="cfg-comment" style="margin-bottom:8px">' + m.desc + '</div>' +
          '<label style="font-size:13px;color:#555;display:flex;align-items:center;gap:6px;margin-bottom:8px;cursor:pointer"><input type="checkbox" id="ln-' + m.key + '-enabled" ' + (n.enabled === false ? '' : 'checked') + '> 启用此节点</label>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 12px">' +
            '<div style="margin-bottom:8px"><div style="font-size:12px;color:#888;margin-bottom:2px">温度</div><input id="ln-' + m.key + '-temperature" type="number" step="0.1" min="0" max="2" value="' + (n.temperature ?? 0) + '" style="width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box"></div>' +
            '<div style="margin-bottom:8px"><div style="font-size:12px;color:#888;margin-bottom:2px">最大 token</div><input id="ln-' + m.key + '-maxTokens" type="number" min="1" max="2000" value="' + (n.maxTokens ?? 100) + '" style="width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box"></div>' +
          '</div>' +
          '<div style="font-size:11px;color:#999;margin-top:2px;line-height:1.6">关闭=该环节不调 LLM，自动降级为规则。温度：0=稳定、越高越灵活（建议 0~0.7）。token：单次回复字数上限。模型统一在「系统配置 → LLM 连接」配置。</div>' +
        '</div>';
      });
      html += '</div>' +
        '<button id="llm-nodes-save" class="btn-sm btn-primary" style="padding:8px 24px;margin-top:14px">保存节点配置</button>' +
        '<span id="llm-nodes-msg" style="margin-left:10px;font-size:12px;color:#2e7d32"></span>';
      box.innerHTML = html;
      var saveBtn = document.getElementById('llm-nodes-save');
      if (saveBtn) saveBtn.onclick = function() {
        var payload = {};
        var bad = [];
        LLM_NODES_META.forEach(function(m) {
          var t = parseFloat(document.getElementById('ln-' + m.key + '-temperature').value);
          var mt = parseInt(document.getElementById('ln-' + m.key + '-maxTokens').value, 10);
          if (isNaN(t) || isNaN(mt)) { bad.push(m.name); return; }
          payload[m.key] = {
            enabled: document.getElementById('ln-' + m.key + '-enabled').checked,
            temperature: t,
            maxTokens: mt,
          };
        });
        if (bad.length) { alert('以下节点参数格式错误：' + bad.join('、')); return; }
        api('POST', '/api/config', { llmNodes: payload }, function(res) {
          var msg = document.getElementById('llm-nodes-msg');
          if (res.success) { if (msg) msg.textContent = '✓ 已保存并生效'; }
          else alert('节点配置保存失败：' + (res.message || '未知错误'));
        });
      };
    });
  }

    api('GET', '/api/config', null, function(cfg) {
      var el = document.getElementById('llm-status');

      var st = cfg.llmEnabled ? '<span class="status-tag on">已启用</span>' : '<span class="status-tag off">未启用</span>';
      el.innerHTML = st + ' ｜ 模型：' + esc(cfg.llmModel || '-') + ' ｜ 接口：' + esc(cfg.llmApiUrl || '-') + ' ｜ 理解模式：' + esc(cfg.nluMode || 'hybrid');
    });
    // 调用节点配置（可视化编辑）
    renderLLMNodes();
    // 调用点清单
    api('GET', '/api/config/llm-prompts', null, function(res) {
      var el = document.getElementById('llm-calls');
      if (!el || !res.success) return;
      var data = res.data || [];
      if (!data.length) { el.innerHTML = '<div class="task-empty">暂无提示词配置</div>'; return; }
      var html = '<div class="task-table-wrap"><table class="el-table" style="width:100%"><thead><tr><th style="width:220px">提示词</th><th>用途</th><th style="width:90px">状态</th><th style="width:150px">操作</th></tr></thead><tbody>';
      data.forEach(function(p) {
        var statusCls = p.isCustom ? 'on' : '';
        html += '<tr><td>' + esc(p.name) + '</td><td style="font-size:12px;color:#888">' + esc(p.desc||'') + '</td>' +
          '<td><span class="status-tag ' + statusCls + '">' + (p.isCustom ? '已自定义' : '默认') + '</span></td>' +
          '<td><button class="btn-sm" onclick="editLLMPrompt(\'' + esc(p.key) + '\')">编辑</button> ' +
          (p.isCustom ? '<button class="btn-sm" onclick="resetLLMPrompt(\'' + esc(p.key) + '\')">恢复默认</button>' : '') +
          '</td></tr>';
      });
      html += '</tbody></table></div>';
      html += '<div style="color:#999;font-size:12px;margin-top:8px">提示词改动保存后立即生效（无需重启）；点"恢复默认"即回退内置模板。</div>';
      el.innerHTML = html;
    });
  }

  window.editLLMPrompt = function(key) {
    api('GET', '/api/config/llm-prompts', null, function(res) {
      if (!res.success) return;
      var p = (res.data||[]).find(function(x){ return x.key === key; });
      if (!p) return;
      showLLMPromptModal(p);
    });
  };

  function showLLMPromptModal(p) {
    var overlay = document.createElement('div');
    overlay.className = 'task-modal-overlay';
    overlay.innerHTML = '<div class="task-modal" style="width:min(94vw,900px)">' +
      '<div class="task-modal-header"><h3>' + esc(p.name) + '</h3><button class="close-btn" id="llm-modal-close">&times;</button></div>' +
      '<div class="task-modal-body">' +
        '<div style="font-size:12px;color:#888;margin-bottom:8px">' + esc(p.desc||'') + '</div>' +
        (p.placeholders && p.placeholders.length ? '<div style="font-size:12px;color:#999;margin-bottom:8px">可用占位符（系统自动填充）：<code>{' + p.placeholders.join('}</code> <code>{') + '}</code></div>' : '') +
        '<div class="form-group"><label>提示词内容</label><textarea id="llm-prompt-value" rows="9" style="width:100%;font-family:monospace;font-size:12px;box-sizing:border-box">' + esc(p.value) + '</textarea></div>' +
      '</div>' +
      '<div class="task-modal-footer">' +
        '<button class="btn-sm" id="llm-prompt-reset">恢复默认</button>' +
        '<button class="btn-sm" id="llm-prompt-cancel">取消</button>' +
        '<button class="btn-sm btn-primary" id="llm-prompt-save">保存</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    overlay.querySelector('#llm-modal-close').onclick = function(){ overlay.remove(); };
    overlay.querySelector('#llm-prompt-cancel').onclick = function(){ overlay.remove(); };
    overlay.querySelector('#llm-prompt-reset').onclick = function(){
      overlay.querySelector('#llm-prompt-value').value = p.default || '';
    };
    overlay.querySelector('#llm-prompt-save').onclick = function(){
      var val = overlay.querySelector('#llm-prompt-value').value.trim();
      if (hasNonBmp(val)) { alert('提示词包含不支持的字符（emoji 等特殊符号，数据库为旧版 utf8 不支持），请移除后保存。'); return; }
      var payload = {};
      payload[p.key] = val;
      api('POST', '/api/config/llm-prompts', { prompts: payload }, function(res) {
        if (res.success) { overlay.remove(); loadLLMPanel(); }
        else alert(res.message || '保存失败');
      });
    };
  }

  window.resetLLMPrompt = function(key) {
    var payload = {};
    payload[key] = '';
    api('POST', '/api/config/llm-prompts', { prompts: payload }, function(res) {
      if (res.success) loadLLMPanel();
    });
  };

  // ===== 任务面板 HTML =====
  function buildTaskPanelHTML() {
    return '<div class="task-panel">' +
      '<div class="task-header">' +
        '<h4>任务流程管理</h4>' +
        '<button class="btn-sm btn-primary" id="task-add-btn">+ 新建任务</button>' +
      '</div>' +
      '<div id="task-list-area"><div class="task-empty"><div class="icon">📋</div><div>加载中...</div></div></div>' +
    '</div>';
  }

  // ===== 加载任务列表 =====
  function loadTasks() {
    var area = document.getElementById('task-list-area');
    if (!area) return;
    api('GET', '/api/tasks', null, function(res) {
      if (!res.success || !res.data || !res.data.length) {
        area.innerHTML = '<div class="task-empty"><div class="icon">📋</div><div>暂无任务流程</div><div style="margin-top:8px;font-size:12px">点击"新建任务"创建多轮对话任务</div></div>';
        return;
      }
      var html = '<div class="task-table-wrap"><table class="el-table" style="width:100%">';
      html += '<thead><tr><th style="width:50px">#</th><th>编码</th><th>名称</th><th>触发词</th><th>步骤数</th><th>状态</th><th style="width:180px">操作</th></tr></thead><tbody>';
      res.data.forEach(function(t, i) {
        var kws = (t.trigger_keywords || []).map(function(k){ return typeof k === 'string' ? k : k.regex || ''; }).join(', ');
        var slots = t.slots || [];
        var stepCount = (t.steps && t.steps.length) ? t.steps.length : (slots.length ? '自动' : '0');
        var statusCls = t.status === 1 ? 'on' : 'off';
        var statusText = t.status === 1 ? '启用' : '禁用';
        html += '<tr>';
        html += '<td>' + (i+1) + '</td>';
        html += '<td><code>' + esc(t.code) + '</code></td>';
        html += '<td>' + esc(t.name) + '</td>';
        html += '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(kws) + '">' + esc(kws || '-') + '</td>';
        html += '<td>' + stepCount + '</td>';
        html += '<td><span class="status-tag ' + statusCls + '">' + statusText + '</span></td>';
        html += '<td>';
        html += '<button class="btn-sm" onclick="editTask(\'' + esc(t.code) + '\')">编辑</button> ';
        html += '<button class="btn-sm" onclick="toggleTask(\'' + esc(t.code) + '\',' + (t.status === 1 ? 0 : 1) + ')">' + (t.status === 1 ? '禁用' : '启用') + '</button> ';
        html += '<button class="btn-sm btn-danger" onclick="deleteTask(\'' + esc(t.code) + '\')">删除</button>';
        html += '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      area.innerHTML = html;
    });
  }

  // ===== 表达挖掘（规则引擎任务tab 与 问题追踪页 共用） =====
  function loadSuggestions(area) {
    if (!area) area = document.getElementById('suggest-area');
    if (!area) return;
    api('GET', '/api/tasks/suggestions?limit=50', null, function(res) {
      if (!res.success) {
        area.innerHTML = '<div class="task-empty"><div>加载失败</div></div>';
        return;
      }
      var items = (res.data && res.data.items) || [];
      if (!items.length) {
        area.innerHTML = '<div class="task-empty"><div class="icon">✅</div><div>暂无待挖掘表达（暂无匹配到任务的未命中话术）</div></div>';
        return;
      }
      var html = '<div class="task-table-wrap"><table class="el-table" style="width:100%"><thead><tr>' +
        '<th>话术</th><th style="width:70px">次数</th><th style="width:160px">匹配任务</th><th style="width:90px">相似度</th><th style="width:70px">信号</th><th style="width:90px">操作</th>' +
        '</tr></thead><tbody>';
      items.forEach(function(s) {
        var score = Math.round((s.score || 0) * 100) + '%';
        var signal = s.reason === 'keyword' ? '<span class="status-tag on">触发词</span>' : '<span class="status-tag" style="border-color:#f0ad4e;color:#f0ad4e">语义</span>';
        html += '<tr>';
        html += '<td>' + esc(s.text) + '</td>';
        html += '<td>' + s.count + '</td>';
        html += '<td>' + esc(s.matchedName || s.matchedTask || '-') + '</td>';
        html += '<td>' + score + '</td>';
        html += '<td>' + signal + '</td>';
        html += '<td><button class="btn-sm" onclick="adoptSuggestion(\'' + esc(s.matchedTask) + '\',\'' + esc(s.text.replace(/'/g, "\\'")) + '\')">采纳</button></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      html += '<div style="color:#999;font-size:12px;margin-top:8px">采纳后该话术加入匹配任务的意图例句，下次同款表达可直接触发任务。</div>';
      area.innerHTML = html;
    });
  }

  window.adoptSuggestion = function(code, text) {
    if (!confirm('将「' + text + '」采纳为「' + code + '」的意图例句？')) return;
    api('POST', '/api/tasks/' + code + '/adopt-example', { text: text }, function(res) {
      if (res.success) {
        alert(res.message || '已采纳');
        var a1 = document.getElementById('suggest-area');
        var a2 = document.getElementById('suggest-issues-area');
        if (a1) loadSuggestions(a1);
        if (a2) loadSuggestions(a2);
        loadTasks();
      } else {
        alert(res.message || '采纳失败');
      }
    });
  };

  // ===== 会话调试（可视化交互图，从左侧导航打开） =====
  // 步骤级别 → 颜色/标签
  var DEBUG_LEVEL_META = {
    info:    { label: '信息', color: '#666' },
    rule:    { label: '规则', color: '#4361ee' },
    llm:     { label: 'LLM',  color: '#7b2ff7' },
    task:    { label: '任务', color: '#2f9e44' },
    warn:    { label: '⚠ 澄清', color: '#e8590c' },
    error:   { label: '错误', color: '#e03131' },
    result:  { label: '结果', color: '#0c8599' },
  };

  // 会话调试容器选择：浮层打开时用浮层元素，否则用 tab 面板
  function debugEl(id) {
    return document.getElementById('debug-overlay-' + id) || document.getElementById('debug-' + id);
  }

  function loadDebugSessions() {
    var area = debugEl('session-list');
    if (!area) return;
    api('GET', '/api/debug/sessions?limit=20', null, function(res) {      if (!res.success) { area.innerHTML = '<div class="task-empty"><div>加载失败</div></div>'; return; }
      var list = res.data || [];
      if (!list.length) {
        area.innerHTML = '<div class="task-empty"><div class="icon">📭</div><div>暂无会话轨迹（先发几条消息再来看）</div></div>';
        return;
      }
      var html = '<div class="task-table-wrap"><table class="el-table" style="width:100%"><thead><tr>' +
        '<th>会话 ID</th><th style="width:60px">轮次</th><th style="width:90px">最后时间</th><th>最后输入</th><th style="width:80px">操作</th></tr></thead><tbody>';
      list.forEach(function(s) {
        var t = new Date(s.lastActive);
        var time = t.getHours() + ':' + String(t.getMinutes()).padStart(2,'0') + ':' + String(t.getSeconds()).padStart(2,'0');
        html += '<tr>';
        html += '<td><code>' + esc(s.sessionId) + '</code></td>';
        html += '<td>' + s.turns + '</td>';
        html += '<td>' + time + '</td>';
        html += '<td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(s.lastInput || '-') + '</td>';
        html += '<td><button class="btn-sm" onclick="viewDebugTrace(\'' + esc(s.sessionId) + '\')">查看</button></td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      area.innerHTML = html;
    });
  }

  window.viewDebugTrace = function(sessionId) {
    api('GET', '/api/debug/session/' + encodeURIComponent(sessionId), null, function(res) {
      if (!res.success || !res.data) return;
      renderDebugTrace(sessionId, res.data.turns || []);
    });
  };

  // 渲染交互图：时间线式，每轮 = 用户输入 → 处理步骤 → 机器人回复
  function renderDebugTrace(sessionId, turns) {
    var view = debugEl('trace-view');
    if (!view) return;
    if (!turns.length) {
      view.innerHTML = '<div class="task-empty"><div>该会话暂无轨迹</div></div>';
      return;
    }
    var html = '<div class="debug-header" style="margin-bottom:12px">' +
      '<h4 style="margin:0">会话 ' + esc(sessionId) + '</h4></div>';
    turns.forEach(function(turn, ti) {
      var input = turn.input || '';
      var output = turn.output || '';
      var steps = turn.steps || [];
      var dur = turn.duration ? (turn.duration + 'ms') : '';
      html += '<div style="border:1px solid #e9ecef;border-radius:8px;margin-bottom:12px;padding:12px;background:#fff">';
      html += '<div style="font-size:12px;color:#999;margin-bottom:8px">第 ' + (ti + 1) + ' 轮 ' + (dur ? '｜耗时 ' + dur : '') + '</div>';
      // 用户输入
      html += '<div style="display:flex;align-items:flex-start;margin-bottom:8px">' +
        '<span class="debug-bubble user">👤</span>' +
        '<div class="debug-bubble" style="background:#e7f5ff;border:1px solid #a5d8ff;border-radius:8px;padding:6px 10px;margin-left:8px;max-width:70%">' + esc(input) + '</div></div>';
      // 处理步骤链
      if (steps.length) {
        html += '<div style="margin:8px 0 8px 28px;border-left:2px solid #dee2e6;padding-left:12px">';
        steps.forEach(function(s) {
          var meta = DEBUG_LEVEL_META[s.level] || DEBUG_LEVEL_META.info;
          var detail = '';
          try {
            if (s.detail && Object.keys(s.detail).length) {
              // 相似度明细（taskTop/faqTop）单独换行展示，其余 JSON 折叠
              var d = s.detail;
              var lines = [];
              if (d.taskTop) { lines.push('📋 任务相似度: ' + d.taskTop); }
              if (d.faqTop) { lines.push('📚 FAQ相似度: ' + d.faqTop); }
              var rest = {};
              Object.keys(d).forEach(function(k) {
                if (k !== 'taskTop' && k !== 'faqTop') rest[k] = d[k];
              });
              if (Object.keys(rest).length) lines.push(JSON.stringify(rest));
              detail = ' <span style="color:#868e96;word-break:break-all">' + lines.map(function(l){ return '<div style="white-space:pre-wrap">' + esc(l) + '</div>'; }).join('') + '</span>';
            }
          } catch(e) {}
          html += '<div style="font-size:12px;margin:3px 0;color:' + meta.color + '">' +
            '<span style="display:inline-block;min-width:44px;font-weight:600">[' + meta.label + ']</span>' +
            esc(s.step) + detail + '</div>';
        });
        html += '</div>';
      }
      // 机器人回复
      html += '<div style="display:flex;align-items:flex-start">' +
        '<span class="debug-bubble bot">🤖</span>' +
        '<div style="background:#f1f3f5;border:1px solid #dee2e6;border-radius:8px;padding:6px 10px;margin-left:8px;max-width:70%;font-size:13px">' + esc(String(output || '').slice(0, 200)) + (String(output||'').length > 200 ? '…' : '') + '</div></div>';
      html += '</div>';
    });
    view.innerHTML = html;
  }
  // 暴露给浮层/菜单使用
  window.loadDebugSessions = loadDebugSessions;
  window.renderDebugTrace = renderDebugTrace;

  // ===== 会话调试独立浮层（从左侧导航打开，用起来方便） =====
  window.openDebugOverlay = function() {
    // 移除已有浮层
    var old = document.getElementById('debug-overlay');
    if (old) old.remove();

    var overlay = document.createElement('div');
    overlay.id = 'debug-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:999999;display:flex;align-items:center;justify-content:center';
    overlay.innerHTML = '<div style="background:#fff;border-radius:12px;width:92vw;max-width:1200px;height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)">' +
      '<div style="padding:16px 24px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center">' +
        '<h3 style="margin:0;font-size:16px">🔍 会话调试 · 处理轨迹</h3>' +
        '<div><button class="btn-sm" id="debug-overlay-clear">清空轨迹</button> <button class="btn-sm" id="debug-overlay-close">&times; 关闭</button></div>' +
      '</div>' +
      '<div style="padding:8px 24px;font-size:12px;color:#999">选择会话查看每一轮对话的后端处理逻辑（路由判定、通道选择、挂起/恢复等）。轨迹保存在内存中，重启后清空。</div>' +
      '<div style="flex:1;overflow-y:auto;padding:16px 24px">' +
        '<div id="debug-overlay-session-list"><div class="task-empty"><div class="icon">🔍</div><div>加载中...</div></div></div>' +
        '<div id="debug-overlay-trace-view" style="margin-top:16px"></div>' +
      '</div>' +
    '</div>';
    document.body.appendChild(overlay);

    overlay.querySelector('#debug-overlay-close').onclick = function() { overlay.remove(); };
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('#debug-overlay-clear').onclick = function() {
      if (!confirm('清空所有会话轨迹？')) return;
      api('POST', '/api/debug/clear', null, function(res) {
        if (res.success) {
          // 浮层内重建列表
          var area = document.getElementById('debug-overlay-session-list');
          area.innerHTML = '<div class="task-empty"><div class="icon">🔍</div><div>加载中...</div></div>';
          loadDebugSessions();
          var traceView = document.getElementById('debug-overlay-trace-view');
          if (traceView) traceView.innerHTML = '';
        }
      });
    };
    loadDebugSessions();
  };

  // 向左侧导航菜单注入"会话调试"菜单项（外部 Vue 应用渲染完成后追加）
  var menuInjected = false;
  var menuObserver = new MutationObserver(function() {
    if (menuInjected) return;
    var menu = document.querySelector('.el-menu');
    if (!menu) return;
    // 已存在则不重复
    if (menu.querySelector('.el-menu-item[data-debug-menu]')) { menuInjected = true; return; }
    // 追加菜单项
    var item = document.createElement('li');
    item.className = 'el-menu-item';
    item.setAttribute('data-debug-menu', '1');
    item.setAttribute('style', 'cursor:pointer');
    item.innerHTML = '<i class="el-icon"><svg viewBox="0 0 1024 1024" width="1em" height="1em"><path fill="currentColor" d="M512 64a448 448 0 1 0 0 896 448 448 0 0 0 0-896zm0 128a320 320 0 1 1 0 640 320 320 0 0 1 0-640zm-32 96h64v288l192 128-32 48-224-144V288z"/></svg></i><span>会话调试</span>';
    item.onclick = function() {
      // 高亮当前项
      menu.querySelectorAll('.el-menu-item').forEach(function(m) { m.classList.remove('is-active'); });
      item.classList.add('is-active');
      window.openDebugOverlay();
    };
    menu.appendChild(item);
    menuInjected = true;
  });
  menuObserver.observe(document.getElementById('app'), { childList: true, subtree: true });
  // 立即检查一次（菜单可能已渲染完成）
  (function tryInjectNow() {
    var menu = document.querySelector('.el-menu');
    if (menu && !document.querySelector('.el-menu-item[data-debug-menu]')) {
      var item = document.createElement('li');
      item.className = 'el-menu-item';
      item.setAttribute('data-debug-menu', '1');
      item.setAttribute('style', 'cursor:pointer');
      item.innerHTML = '<i class="el-icon"><svg viewBox="0 0 1024 1024" width="1em" height="1em"><path fill="currentColor" d="M512 64a448 448 0 1 0 0 896 448 448 0 0 0 0-896zm0 128a320 320 0 1 1 0 640 320 320 0 0 1 0-640zm-32 96h64v288l192 128-32 48-224-144V288z"/></svg></i><span>会话调试</span>';
      item.onclick = function() {
        menu.querySelectorAll('.el-menu-item').forEach(function(m) { m.classList.remove('is-active'); });
        item.classList.add('is-active');
        window.openDebugOverlay();
      };
      menu.appendChild(item);
      menuInjected = true;
    }
  })();

      '<div class="task-modal-header"><h3>' + (isEdit ? '编辑任务' : '新建任务') + '</h3><button class="close-btn" id="task-modal-close">&times;</button></div>' +

        '<div class="form-group"><label>任务名称</label><input id="tf-name" value="' + esc(isEdit ? task.name : '') + '" placeholder="如：报修工单"></div>' +
        '<div class="form-group"><label>描述</label><textarea id="tf-desc" placeholder="任务描述（可选）">' + esc(isEdit ? (task.description || '') : '') + '</textarea></div>' +
        '<div class="form-group"><label>触发关键词（回车添加）</label>' +
          '<div id="tf-keywords">' + buildKeywordTags(isEdit ? task.trigger_keywords : []) + '</div>' +
