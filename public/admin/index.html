        alert('流程步骤有误：\n' + stepErrors.map(function(e) { return '· ' + e; }).join('\n'));
        return;
      }
      // 调用接口配置（仅当完成动作选 call_api 时）
      var apiAction = undefined;
      if (overlay.querySelector('#tf-action').value === 'call_api') {
        var apiUrl = overlay.querySelector('#tf-api-url').value.trim();
        if (!apiUrl) { alert('选择"调用接口"后请填写接口地址'); return; }
        var fieldMap = {};
        overlay.querySelector('#tf-api-fieldmap').value.split('\n').forEach(function(l) {
          l = l.trim(); if (!l) return;
          var eq = l.indexOf('=');
          if (eq <= 0) return;
          var k = l.slice(0, eq).trim(), v = l.slice(eq + 1).trim();
          if (k) fieldMap[k] = v;
        });
        apiAction = {
          url: apiUrl,
          method: overlay.querySelector('#tf-api-method').value || 'POST',
          fieldMap: Object.keys(fieldMap).length ? fieldMap : undefined,
          successMessage: overlay.querySelector('#tf-api-success-msg').value.trim() || undefined,
        };
      }
      var data = {
        code: code,
        name: name,
        description: overlay.querySelector('#tf-desc').value.trim(),
        trigger_keywords: keywords,
        slots: slots,
        steps: steps.length ? steps : undefined,
        intent_examples: examples.length ? examples : undefined,
        // 冲突澄清配置（可选）
        clarify_question: overlay.querySelector('#tf-clarify-question').value.trim() || undefined,
        clarify_options: (function() {
          var v = overlay.querySelector('#tf-clarify-options').value.trim();
          if (!v) return undefined;
          return v.split('\n').map(function(x) { return x.trim(); }).filter(Boolean);
        })(),
        // 任务级仲裁阈值（留空 → undefined → 存 NULL 用全局）
        arb_gap: (function() { var v = overlay.querySelector('#tf-arb-gap').value.trim(); return v === '' ? undefined : parseFloat(v); })(),
        arb_task_min: (function() { var v = overlay.querySelector('#tf-arb-task-min').value.trim(); return v === '' ? undefined : parseFloat(v); })(),
        arb_faq_min: (function() { var v = overlay.querySelector('#tf-arb-faq-min').value.trim(); return v === '' ? undefined : parseFloat(v); })(),
        arb_strong_hit: (function() { var v = overlay.querySelector('#tf-arb-strong-hit').value.trim(); return v === '' ? undefined : parseFloat(v); })(),
        // 任务级 LLM 配置（未改动 → undefined → 不覆盖全局；勾选/填值 → 只存差异项）
        llm: (function() {
          function nodeOf(prefix) {
            var enabledChecked = overlay.querySelector('#tf-llm-' + prefix + '-enabled').checked;
            var temp = overlay.querySelector('#tf-llm-' + prefix + '-temp').value.trim();
            var tokens = overlay.querySelector('#tf-llm-' + prefix + '-tokens').value.trim();
            var node = {};
            if (!enabledChecked) node.enabled = false;
            if (temp !== '') { var t = parseFloat(temp); if (!isNaN(t)) node.temperature = t; }
            if (tokens !== '') { var m = parseInt(tokens, 10); if (!isNaN(m)) node.maxTokens = m; }
            return Object.keys(node).length ? node : undefined;
          }
          var out = {};
          if (overlay.querySelector('#tf-llm-enabled').checked) out.enabled = false;
          var dlg = nodeOf('dialogue');
          if (dlg) out.dialogue = dlg;
          var ext = nodeOf('extract');
          if (ext) out.extract = ext;
          var prompts = {};
          ['dialogue-system','dialogue-user','extract-system','extract-user'].forEach(function(id) {
            var key = id.split('-').map(function(w, i) { return i === 0 ? w : w.charAt(0).toUpperCase() + w.slice(1); }).join('');
            var v = overlay.querySelector('#tf-llm-' + id).value.trim();
            // 与全局一致 = 没定制 → 不存（继续用全局）；改了才存；清空 = 用全局默认
            if (v && v !== globalPrompts[id]) prompts[key] = v;
          });
          if (Object.keys(prompts).length) out.prompts = prompts;
          return Object.keys(out).length ? out : undefined;
        })(),
        completion_message: overlay.querySelector('#tf-action-msg').value.trim() || overlay.querySelector('#tf-complete').value.trim(),
        on_complete: overlay.querySelector('#tf-action').value || '',
        api_action: apiAction,
        status: 1,
      };
      api('POST', '/api/tasks', data, function(res) {
        if (res.success) {
          overlay.remove();
          loadTasks();
        } else {
          alert(res.message || '保存失败');
        }
      });
    };
  }

  function buildKeywordTags(keywords) {
    if (!keywords || !keywords.length) return '<span style="color:#999;font-size:12px">暂无关键词</span>';
    return keywords.map(function(k) {
      var val = typeof k === 'string' ? k : (k.regex || '');
      return '<span class="keyword-tag" data-value="' + esc(val) + '">' + esc(val) + '<span class="remove">&times;</span></span>';
    }).join('');
  }

  function buildExampleTags(examples) {
    if (!examples || !examples.length) return '<span style="color:#999;font-size:12px">暂无例句（将自动使用触发词）</span>';
    return examples.map(function(e) {
      return '<span class="keyword-tag" data-value="' + esc(e) + '">' + esc(e) + '<span class="remove">&times;</span></span>';
    }).join('');
  }

  function buildSlotRows(slots) {
    if (!slots || !slots.length) return '<div style="color:#999;font-size:12px;padding:8px">暂无槽位，点击下方添加</div>';
    return slots.map(function(s) { return buildOneSlotRow(s); }).join('');
  }

  function buildOneSlotRow(s) {
    return '<div class="slot-row">' +
      '<input class="slot-key" value="' + esc(s.key||'') + '" placeholder="字段名">' +
      '<input class="slot-label" value="' + esc(s.label||'') + '" placeholder="显示名">' +
      '<input class="slot-prompt" value="' + esc(s.prompt||'') + '" placeholder="提问话术">' +
      '<select class="slot-type">' +
        '<option value="text"' + (s.extract_type==='text'?' selected':'') + '>文本</option>' +
        '<option value="regex"' + (s.extract_type==='regex'?' selected':'') + '>正则</option>' +
        '<option value="number"' + (s.extract_type==='number'?' selected':'') + '>数字</option>' +
        '<option value="enum"' + (s.extract_type==='enum'?' selected':'') + '>枚举</option>' +
      '</select>' +
      '<input class="slot-rule" value="' + esc(s.extract_rule||'') + '" placeholder="提取规则" style="width:120px">' +
      '<label class="slot-required"><input type="checkbox"' + (s.required!==false?' checked':'') + '>必填</label>' +
      '<button class="slot-del">&times;</button>' +
    '</div>';
  }

  function bindSlotDel(row) {
    var del = row.querySelector('.slot-del');
    if (del) del.onclick = function() { row.remove(); };
  }

  // ===== v2 步骤 DSL 编辑器 =====

  // 下拉选项 helper
  function optHtml(value, label, selected) {
    return '<option value="' + esc(value) + '"' + (selected ? ' selected' : '') + '>' + esc(label) + '</option>';
  }
  function buildSlotOptions(sel, slotKeys) {
    var html = optHtml('', '— 选择槽位 —', !sel);
    slotKeys.forEach(function(k) { html += optHtml(k, k, sel === k); });
    return html;
  }
  function buildStepKeyOptions(sel, stepKeys, placeholder) {
    var html = optHtml('', '— ' + (placeholder || '选择步骤') + ' —', !sel);
    stepKeys.forEach(function(k) { html += optHtml(k, k, sel === k); });
    return html;
  }
  // 当前表单里的步骤 key（重建行/加行时取最新）
  function currentStepKeys() {
    var keys = [];
    document.querySelectorAll('#tf-steps .step-row .step-key').forEach(function(el) {
      var v = el.value.trim(); if (v) keys.push(v);
    });
    return keys;
  }
  // 当前表单里的槽位 key（槽位行 + 收集步骤的 slot_key）
  function currentSlotKeys() {
    var keys = [];
    document.querySelectorAll('#tf-slots .slot-row .slot-key').forEach(function(el) {
      var v = el.value.trim(); if (v) keys.push(v);
    });
    document.querySelectorAll('#tf-steps .step-row .step-slot').forEach(function(el) {
      var v = el.value.trim(); if (v) keys.push(v);
    });
    return [...new Set(keys)];
  }

  // 分支条件行
  function buildCaseRow(c, stepKeys, slotKeys) {
    c = c || {};
    var when = c.when || {};
    return '<div class="case-row">' +
      '<select class="case-slot" style="width:110px">' + buildSlotOptions(when.slot, slotKeys) + '</select>' +
      '<select class="case-op" style="width:90px">' + ['eq', 'contains', 'regex'].map(function(op) {
        return '<option value="' + op + '"' + (when.op === op ? ' selected' : '') + '>' + ({eq:'等于',contains:'包含',regex:'匹配'})[op] + '</option>';
      }).join('') + '</select>' +
      '<input class="case-val" value="' + esc(when.value || '') + '" placeholder="条件值" style="width:110px">' +
      '<select class="case-next" style="width:110px">' + buildStepKeyOptions(c.next, stepKeys, '跳转到…') + '</select>' +
      '<button type="button" class="case-del" title="删除条件">&times;</button>' +
    '</div>';
  }

  // key=value 映射行编辑器（fieldMap / fixedParams / resultMap 共用）
  function buildMapRows(obj, clsPrefix, keyPlaceholder, valPlaceholder) {
    var rows = Object.entries(obj || {}).map(function(pair) {
      return '<div class="map-row">' +
        '<input class="' + clsPrefix + '-key" value="' + esc(pair[0]) + '" placeholder="' + keyPlaceholder + '" style="width:130px">' +
        '<input class="' + clsPrefix + '-val" value="' + esc(pair[1]) + '" placeholder="' + valPlaceholder + '" style="width:180px">' +
        '<button type="button" class="map-del" title="删除">&times;</button>' +
      '</div>';
    }).join('');
    return '<div class="map-rows">' + rows +
      '<button type="button" class="btn-sm map-add" data-cls="' + clsPrefix + '" style="margin:2px 0 4px">+ 添加一行</button>' +
      '</div>';
  }

  function buildStepRows(steps) {
    if (!steps || !steps.length) return '<div style="color:#999;font-size:12px;padding:8px">暂无步骤，点击"从槽位自动生成"一键生成</div>';
    var stepKeys = steps.map(function(s) { return s.key; }).filter(Boolean);
    var slotKeys = currentSlotKeys();
    return steps.map(function(s) { return buildOneStepRow(s, stepKeys, slotKeys); }).join('');
  }

  function buildOneStepRow(s, stepKeys, slotKeys) {
    s = s || {};
    var collectExtra = s.type === 'collect' ?
      '<input class="step-slot" value="' + esc(s.slot_key||'') + '" placeholder="槽位key" style="width:90px">' +
      '<input class="step-prompt" value="' + esc(s.prompt||'') + '" placeholder="提问话术">' +
      '<input class="step-extract" value="' + esc((s.extract&&s.extract.method)||'') + '" placeholder="提取:text/regex/number/enum" style="width:120px">' +
      '<input class="step-rule" value="' + esc((s.extract&&s.extract.rule)||'') + '" placeholder="提取规则/枚举" style="width:110px">' +
      '<input class="step-validate" value="' + esc((s.validate&&s.validate.rule)||'') + '" placeholder="校验规则" style="width:100px">' +
      '<input class="step-reask" value="' + esc((s.validate&&s.validate.reask)||'') + '" placeholder="重问话术" style="width:130px">' : '';
    var actionExtra = s.type === 'action' ?
      '<input class="step-action" value="' + esc(s.action||'') + '" placeholder="动作名" style="width:130px">' +
      '<input class="step-msg" value="' + esc(s.done_message||'') + '" placeholder="完成话术">' : '';
    var apiExtra = s.type === 'api' ?
      '<input class="step-api-url" value="' + esc(s.url||'') + '" placeholder="接口地址" style="width:190px">' +
      '<select class="step-api-method"><option value="POST"' + ((s.method||'POST')==='POST'?' selected':'') + '>POST</option><option value="GET"' + (s.method==='GET'?' selected':'') + '>GET</option></select>' +
      '<input class="step-api-rs" value="' + esc(s.resultSlot||'') + '" placeholder="结果槽位key" style="width:90px">' +
      '<input class="step-api-rf" value="' + esc(s.resultField||'') + '" placeholder="结果字段(如 data.x)" style="width:100px">' +
      '<div style="font-size:11px;color:#888">请求入参（槽位key = 接口字段）</div>' + buildMapRows(s.fieldMap, 'fm', '槽位key', '接口字段') +
      '<div style="font-size:11px;color:#888">固定入参（接口字段 = 固定值）</div>' + buildMapRows(s.fixedParams, 'fp', '接口字段', '固定值') +
      '<div style="font-size:11px;color:#888">结果映射（槽位key = 接口字段路径，优先于单字段）</div>' + buildMapRows(s.resultMap, 'rm', '槽位key', '字段路径如 data.orderNo') +
      '<input class="step-api-msg" value="' + esc(s.done_message||'') + '" placeholder="回复话术(支持 {结果槽位})" style="width:200px">' : '';
    var subtaskExtra = s.type === 'subtask' ?
      '<input class="step-task" value="' + esc(s.task||'') + '" placeholder="子任务code">' +
      '<select class="step-return" style="width:110px">' + buildStepKeyOptions(s.on_return, stepKeys, '返回步骤') + '</select>' : '';
    var messageExtra = s.type === 'message' ?
      '<input class="step-text" value="' + esc(s.text||'') + '" placeholder="回复内容">' : '';
    var branchExtra = s.type === 'branch' ?
      '<div class="branch-cases" style="margin:2px 0">' +
        (s.cases || []).map(function(c) { return buildCaseRow(c, stepKeys, slotKeys); }).join('') +
      '</div>' +
      '<button type="button" class="btn-sm branch-add-case" style="margin:2px 4px 2px 0">+ 添加条件</button>' +
      '<select class="step-default" style="width:130px">' + buildStepKeyOptions(s.default_next, stepKeys, '默认下一步') + '</select>' : '';
    return '<div class="step-row">' +
      '<input class="step-key" value="' + esc(s.key||'') + '" placeholder="步骤key" style="width:100px">' +
      '<select class="step-type">' +
        '<option value="collect"' + (s.type==='collect'?' selected':'') + '>收集</option>' +
        '<option value="confirm"' + (s.type==='confirm'?' selected':'') + '>确认</option>' +
        '<option value="action"' + (s.type==='action'?' selected':'') + '>动作</option>' +
        '<option value="api"' + (s.type==='api'?' selected':'') + '>调用接口</option>' +
        '<option value="subtask"' + (s.type==='subtask'?' selected':'') + '>子任务</option>' +
        '<option value="branch"' + (s.type==='branch'?' selected':'') + '>分支</option>' +
        '<option value="message"' + (s.type==='message'?' selected':'') + '>回复</option>' +
      '</select>' +
      '<input class="step-next" value="' + esc(s.next||'') + '" placeholder="下一步" style="width:90px">' +
      collectExtra + actionExtra + apiExtra + subtaskExtra + messageExtra + branchExtra +
      '<button class="step-up" title="上移">↑</button><button class="step-down" title="下移">↓</button><button class="step-del" title="删除">&times;</button>' +
    '</div>';
  }

  function bindStepRowEvents(row) {
    var del = row.querySelector('.step-del');
    if (del) del.onclick = function() { row.remove(); };
    var up = row.querySelector('.step-up');
    if (up) up.onclick = function() {
      var prev = row.previousElementSibling;
      if (prev && prev.classList.contains('step-row')) row.parentNode.insertBefore(row, prev);
    };
    var down = row.querySelector('.step-down');
    if (down) down.onclick = function() {
      var next = row.nextElementSibling;
      if (next && next.classList.contains('step-row')) row.parentNode.insertBefore(next, row);
    };
    // 行内动态子元素事件（分支条件行 / 映射行的增删）——事件委托
    row.addEventListener('click', function(e) {
      var t = e.target;
      if (t.classList.contains('case-del')) {
        var cr = t.closest('.case-row');
        if (cr) cr.remove();
      } else if (t.classList.contains('map-del')) {
        var mr = t.closest('.map-row');
        if (mr) mr.remove();
      } else if (t.classList.contains('branch-add-case')) {
        var wrap = row.querySelector('.branch-cases');
        if (wrap) wrap.insertAdjacentHTML('beforeend', buildCaseRow(null, currentStepKeys(), currentSlotKeys()));
      } else if (t.classList.contains('map-add')) {
        var mw = t.closest('.map-rows');
        if (mw) {
          var cls = t.getAttribute('data-cls');
          var ph = cls === 'fm' ? ['槽位key', '接口字段'] : (cls === 'fp' ? ['接口字段', '固定值'] : ['槽位key', '字段路径如 data.orderNo']);
          mw.insertAdjacentHTML('beforeend',
            '<div class="map-row">' +
            '<input class="' + cls + '-key" placeholder="' + ph[0] + '" style="width:130px">' +
            '<input class="' + cls + '-val" placeholder="' + ph[1] + '" style="width:180px">' +
            '<button type="button" class="map-del" title="删除">&times;</button></div>');
        }
      }
    });
    // 类型切换：重读全部步骤、更新该行类型后整体重渲染
    var typeSel = row.querySelector('.step-type');
    if (typeSel) typeSel.onchange = function() {
      var steps = collectStepRows();
      var idx = Array.prototype.indexOf.call(row.parentNode.children, row);
      if (idx >= 0 && steps[idx]) steps[idx].type = typeSel.value;
      var container = document.getElementById('tf-steps');
      container.innerHTML = buildStepRows(steps);
      container.querySelectorAll('.step-row').forEach(bindStepRowEvents);
    };
  }

  function collectStepRows() {
    // 安全读取：类型切换瞬间 DOM 可能还是旧类型表单（如 collect 行切到 branch），
    // 元素不存在时按空处理，避免 null.value 崩溃
    function q(row, cls) { var el = row.querySelector(cls); return el ? el.value.trim() : ''; }
    function qr(row, cls) { var el = row.querySelector(cls); return el ? el.value : ''; }
    var steps = [];
    document.querySelectorAll('#tf-steps .step-row').forEach(function(row) {
      var key = q(row, '.step-key');
      var type = qr(row, '.step-type');
      if (!key) return;
      var step = { key: key, type: type, next: q(row, '.step-next') || undefined };
      if (type === 'collect') {
        step.slot_key = (q(row, '.step-slot') || key).trim();
        step.prompt = q(row, '.step-prompt');
        step.extract = { method: q(row, '.step-extract') || 'text', rule: q(row, '.step-rule') };
        var vr = q(row, '.step-validate');
        var vk = q(row, '.step-reask');
        if (vr) step.validate = { rule: vr, reask: vk };
      } else if (type === 'action') {
        step.action = q(row, '.step-action') || 'complete_message';
        var dm = q(row, '.step-msg');
        if (dm) step.done_message = dm;
      } else if (type === 'api') {
        step.url = q(row, '.step-api-url');
        step.method = qr(row, '.step-api-method') || 'POST';
        step.resultSlot = q(row, '.step-api-rs') || undefined;
        step.resultField = q(row, '.step-api-rf') || undefined;
        var fm = readMapRows(row, 'fm');
        if (Object.keys(fm).length) step.fieldMap = fm;
        var fp = readMapRows(row, 'fp');
        if (Object.keys(fp).length) step.fixedParams = fp;
        // 回复话术：允许存空字符串（空 = 调用接口后不向用户回显结果）
        step.done_message = q(row, '.step-api-msg');
        // 结果映射（多字段）：槽位key=接口字段路径，优先于 resultSlot/resultField
        var rm = readMapRows(row, 'rm');
        if (Object.keys(rm).length) step.resultMap = rm;
      } else if (type === 'subtask') {
        step.task = q(row, '.step-task');
        step.on_return = q(row, '.step-return') || undefined;
      } else if (type === 'message') {
        step.text = q(row, '.step-text');
      } else if (type === 'branch') {
        var cases = [];
        row.querySelectorAll('.case-row').forEach(function(crow) {
          var slot = qr(crow, '.case-slot');
          var op = qr(crow, '.case-op');
          var val = q(crow, '.case-val');
          var next = qr(crow, '.case-next');
          if (!slot || !op || !next) return; // 不完整的条件行忽略（保存前校验会提示）
          cases.push({ when: { slot: slot, op: op, value: val }, next: next });
        });
        if (cases.length) step.cases = cases;
        var dflt = q(row, '.step-default');
        if (dflt) step.default_next = dflt;
      }
      steps.push(step);
    });
    return steps;
  }

  // 读取映射行区：{ key: value }（fm/fp/rm 共用）
  function readMapRows(row, clsPrefix) {
    var m = {};
    row.querySelectorAll('.map-row').forEach(function(mrow) {
      var kEl = mrow.querySelector('.' + clsPrefix + '-key');
      var vEl = mrow.querySelector('.' + clsPrefix + '-val');
      if (!kEl || !vEl) return;
      var k = kEl.value.trim(), v = vEl.value.trim();
      if (k && v) m[k] = v;
    });
    return m;
  }

  // 流程步骤前端校验（保存前）：精确定位第几步、哪个字段
  function validateSteps(steps) {
    var errors = [];
    var keys = new Set(steps.map(function(s) { return s.key; }));
    steps.forEach(function(s, i) {
      var where = '步骤' + (i + 1) + '「' + (s.key || '?') + '」';
      if (!s.key) { errors.push(where + '：缺少步骤 key'); return; }
      if (s.type === 'collect' && !s.slot_key) errors.push(where + '：缺少槽位 key');
      if (s.type === 'api' && !s.url) errors.push(where + '：缺少接口地址');
      if (s.type === 'action' && !s.action) errors.push(where + '：缺少动作名');
      if (s.type === 'subtask' && !s.task) errors.push(where + '：缺少子任务 code');
      if (s.type === 'branch') {
        (s.cases || []).forEach(function(c, ci) {
          var cwhere = where + ' 条件' + (ci + 1);
          if (!c.when || !c.when.slot) errors.push(cwhere + '：未选择槽位');
          if (!c.when || !c.when.op) errors.push(cwhere + '：未选择操作符');
          if (!c.when || c.when.value === undefined || c.when.value === '') errors.push(cwhere + '：缺少条件值');
          if (!c.next) errors.push(cwhere + '：未选择跳转目标');
          else if (!keys.has(c.next)) errors.push(cwhere + '：跳转目标「' + c.next + '」不存在');
        });
        if (s.default_next && !keys.has(s.default_next)) errors.push(where + '：默认下一步「' + s.default_next + '」不存在');
      }
      if (s.next && !keys.has(s.next)) errors.push(where + '：下一步「' + s.next + '」不存在');
    });
    return errors;
  }

  // 从槽位自动生成：收集 → 确认 → 动作
  function autoGenerateSteps() {
    var slots = [];
    document.querySelectorAll('#tf-slots .slot-row').forEach(function(row) {
      var key = row.querySelector('.slot-key').value.trim();
      var label = row.querySelector('.slot-label').value.trim();
      if (!key || !label) return;
      slots.push({
        key: key, label: label,
        prompt: row.querySelector('.slot-prompt').value.trim(),
        extract_type: row.querySelector('.slot-type').value,
        extract_rule: row.querySelector('.slot-rule').value.trim(),
        required: row.querySelector('.slot-required').checked,
      });
    });
    var action = document.getElementById('tf-action').value || 'complete_message';
    var msg = document.getElementById('tf-action-msg').value.trim();
    var steps = [];
    slots.forEach(function(s, i) {
      steps.push({
        key: 'collect_' + s.key, type: 'collect', slot_key: s.key, label: s.label, required: s.required !== false,
        prompt: s.prompt || ('请提供' + s.label),
        extract: { method: s.extract_type || 'text', rule: s.extract_rule || '' },
        next: i < slots.length - 1 ? 'collect_' + slots[i+1].key : 'confirm_step',
      });
    });
    if (slots.length) steps.push({ key: 'confirm_step', type: 'confirm', next: 'submit' });
    steps.push({ key: 'submit', type: 'action', action: action, done_message: msg });
    var container = document.getElementById('tf-steps');
    container.innerHTML = buildStepRows(steps);
    container.querySelectorAll('.step-row').forEach(bindStepRowEvents);
  }

  // 流程链预览：从起点按 next 渲染步骤链（分支显示条件出口）
  function renderFlowPreview(steps) {
    if (!steps || !steps.length) return '<div style="color:#999">暂无步骤</div>';
    var byKey = {};
    steps.forEach(function(s) { byKey[s.key] = s; });
    var referenced = new Set();
    steps.forEach(function(s) {
      if (s.next) referenced.add(s.next);
      (s.cases || []).forEach(function(c) { if (c.next) referenced.add(c.next); });
      if (s.default_next) referenced.add(s.default_next);
    });
    var start = steps.find(function(s) { return !referenced.has(s.key); }) || steps[0];
    var typeLabel = { collect: '收集', confirm: '确认', action: '动作', api: '调用接口', branch: '分支', subtask: '子任务', message: '回复' };
    var opLabel = { eq: '等于', contains: '包含', regex: '匹配' };
    var visited = new Set();
    var html = '';
    function nodeHtml(s) {
      var color = { collect: '#4361ee', confirm: '#2f9e44', action: '#e8590c', api: '#0c8599', branch: '#7b2ff7', subtask: '#e64980', message: '#868e96' }[s.type] || '#666';
      var label = typeLabel[s.type] || s.type;
      var sub = '';
      if (s.type === 'collect' && s.slot_key) sub = ' · ' + s.slot_key;
      if (s.type === 'api' && s.url) sub = ' · ' + String(s.url).replace(/^https?:\/\//, '').slice(0, 40);
      if (s.type === 'action' && s.action) sub = ' · ' + s.action;
      return '<span style="display:inline-block;border-left:3px solid ' + color + ';background:#fff;border-radius:6px;padding:4px 10px;box-shadow:0 1px 2px rgba(0,0,0,.08)">' + esc(s.key) + ' [' + label + ']' + esc(sub) + '</span>';
    }
    function walk(s) {
      if (!s || visited.has(s.key)) return;
      visited.add(s.key);
      html += '<div style="margin:6px 0">' + nodeHtml(s) + '</div>';
      if (s.type === 'branch') {
        (s.cases || []).forEach(function(c) {
          var cond = (c.when ? (c.when.slot + ' ' + (opLabel[c.when.op] || c.when.op) + ' ' + c.when.value) : '?');
          html += '<div style="margin:2px 0 2px 26px;color:#e8590c">↳ 若 ' + esc(cond) + ' → ' + esc(c.next) + '</div>';
          walk(byKey[c.next]);
        });
        if (s.default_next) {
          html += '<div style="margin:2px 0 2px 26px;color:#868e96">↳ 否则 → ' + esc(s.default_next) + '</div>';
          walk(byKey[s.default_next]);
        }
      } else if (s.next) {
        html += '<div style="margin:2px 0 2px 26px;color:#adb5bd">↓ ' + esc(s.next) + '</div>';
        walk(byKey[s.next]);
      } else {
        html += '<div style="margin:2px 0 2px 26px;color:#adb5bd">↓ 结束</div>';
      }
    }
    walk(start);
    return html;
  }

  // ===== 删除任务 =====
  window.deleteTask = function(code) {
    if (!confirm('确定要删除任务「' + code + '」吗？')) return;
    api('DELETE', '/api/tasks/' + code, null, function(res) {
      if (res.success) loadTasks();
      else alert(res.message || '删除失败');
    });
  };

  // ===== 启用/禁用 =====
  window.toggleTask = function(code, status) {
    api('POST', '/api/tasks/' + code + '/toggle', {status: !!status}, function(res) {
      if (res.success) loadTasks();
    });
  };

  // ===== 通用 API 请求 =====
  function api(method, url, data, cb) {
    var xhr = new XMLHttpRequest();
    xhr._isLoginReq = true; // 避免被 auth 拦截器循环
    xhr.open(method, url, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    // 注入 token
    try {
      var token = localStorage.getItem('faq_admin_token');
      if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    } catch(e) {}
    xhr.onload = function() {
      try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({success:false, message:'解析响应失败'}); }
    };
    xhr.onerror = function() { cb({success:false, message:'网络错误'}); };
    xhr.send(data ? JSON.stringify(data) : null);
  }

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
})();
</script>
